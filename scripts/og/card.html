<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/300.css">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/500.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#f8f5ee;color:#1b1c19;font-family:"Noto Serif JP",serif;position:relative}
  .band{position:absolute;inset:0 0 auto 0;height:14px;background:linear-gradient(90deg,#0b2f97,#1442c4 60%,#4f86e0)}
  .sun{position:absolute;right:-120px;top:-140px;width:520px;height:520px;border-radius:50%;
       background:radial-gradient(circle,rgba(242,214,150,.85) 0 18%,rgba(242,214,150,.25) 38%,transparent 62%)}
  .wrap{position:absolute;inset:70px 90px 64px 90px;display:flex;flex-direction:column}
  .label{font-family:Georgia,serif;font-style:italic;font-size:30px;color:#1442c4;letter-spacing:.02em}
  h1{margin:auto 0;font-weight:500;font-size:var(--fs,68px);line-height:1.45;letter-spacing:.03em;word-break:keep-all;overflow-wrap:anywhere;max-width:1000px}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:28px;letter-spacing:.3em;font-weight:300}
  .foot small{font-family:Georgia,serif;font-style:italic;letter-spacing:.04em;font-size:22px;color:#5b5d56}
</style></head>
<body><div class="band"></div><div class="sun"></div>
<div class="wrap"><div class="label" id="label"></div><h1 id="title"></h1>
<div class="foot"><span>ムートン</span><small>personal archive</small></div></div>
<script>
window.render = ({ title, label }) => {
  document.getElementById('label').textContent = label;
  const h = document.getElementById('title');
  h.innerHTML = title;
  const len = h.textContent.length;
  h.style.setProperty('--fs', (len > 34 ? 50 : len > 24 ? 58 : 68) + 'px');
};
</script></body></html>
