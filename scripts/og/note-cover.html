<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/300.css">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/500.css">
<style>
  /* note の記事の見出し画像（1280x670）。シリーズ「30の不安と、30の最初の一歩」用。
     絵はサイトの月夜の絵（images/mouton/）。道ごとに絵を変える。 */
  html,body{margin:0;width:1280px;height:670px;overflow:hidden}
  body{position:relative;background:#070d1c center/cover no-repeat;color:#f4ecd8;font-family:"Noto Serif JP",serif}
  body::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 52%,rgba(5,10,24,.74),rgba(5,10,24,.32) 72%,rgba(5,10,24,.12) 100%)}
  body::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(5,10,24,.72),rgba(5,10,24,0) 22%,rgba(5,10,24,0) 78%,rgba(5,10,24,.72))}
  .top,.foot{z-index:2;text-shadow:0 0 10px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9)}
  .top{position:absolute;left:64px;right:64px;top:48px;display:flex;justify-content:space-between;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:24px;letter-spacing:.22em;color:#e9c684}
  .wrap{z-index:1;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 120px 40px}
  h1{margin:0 0 30px;font-weight:500;line-height:1.5;letter-spacing:.05em;text-shadow:0 2px 26px rgba(0,0,0,.65);word-break:keep-all;overflow-wrap:anywhere;max-width:1040px;text-wrap:balance}
  p{margin:0;font-weight:300;font-size:27px;line-height:1.8;letter-spacing:.07em;color:#dcd3bf;text-shadow:0 1px 14px rgba(0,0,0,.75);max-width:980px;text-wrap:balance}
  .foot{position:absolute;left:64px;right:64px;bottom:42px;display:flex;justify-content:space-between;font-family:Georgia,"Times New Roman",serif;font-size:21px;letter-spacing:.3em;color:#c9b98f}
</style></head>
<body>
<div class="top"><span id="series">30の不安と、30の最初の一歩</span><span id="num"></span></div>
<div class="wrap"><h1 id="big"></h1><p id="small"></p></div>
<div class="foot"><span>MOUTON</span><span id="path"></span></div>
<script>
// html はすでに <wbr> などで区切った文字列。art は ../../images/mouton/ からの相対パス。
window.render = ({ num, total, path, bigHtml, bigLen, small, art, pos, series }) => {
  document.body.style.backgroundImage = `url("${art}")`;
  document.body.style.backgroundPosition = pos || 'center';
  if (series) document.getElementById('series').textContent = series;
  document.getElementById('num').textContent = num ? `${String(num).padStart(2, '0')} / ${total}` : '';
  document.getElementById('path').textContent = path || '';
  const h = document.getElementById('big');
  h.innerHTML = bigHtml;
  h.style.fontSize = (bigLen <= 10 ? 86 : bigLen <= 14 ? 74 : bigLen <= 18 ? 64 : 54) + 'px';
  document.getElementById('small').textContent = small || '';
};
</script>
</body></html>
