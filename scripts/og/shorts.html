<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/400.css">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/600.css">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
  body{background:#0b1020;color:#f5f3ee;font-family:"Noto Serif JP",serif;position:relative}
  .light{position:absolute;border-radius:50%;filter:blur(80px)}
  .l1{width:1200px;height:1200px;left:-420px;top:-520px;background:radial-gradient(circle,rgba(76,114,255,.7),rgba(76,114,255,0) 65%)}
  /* Top half: the quiz. Kept clear of the Shorts header (top) and the button column (right). */
  .top{position:absolute;left:80px;right:150px;top:150px;height:820px}
  .tag{display:inline-block;font:600 32px/1 Georgia,serif;letter-spacing:.22em;padding:14px 28px;border-radius:999px;background:#f5f3ee;color:#0b1020}
  .q{margin-top:56px;font-size:var(--fs,66px);font-weight:600;line-height:1.55;letter-spacing:.02em;word-break:keep-all;overflow-wrap:anywhere}
  .ask{margin-top:36px;font-size:60px;color:#9fb3ff}
  .ans{position:absolute;left:0;right:0;top:0;opacity:0}
  .mark{font-size:300px;line-height:1;font-weight:400}
  .mark.o{color:#5ad19a}.mark.x{color:#ff7a6b}
  .head{margin-top:24px;font-size:56px;font-weight:600;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
  .go{margin-top:34px;font-size:38px;color:#b5bcd0}
  /* Two-choice philosophy mode */
  .choices{display:none;margin-top:44px;gap:24px}
  .philo .choices{display:flex}.philo .ask{display:none}
  .ch{flex:1;border:3px solid rgba(181,188,208,.45);border-radius:28px;padding:26px 26px 30px;font-size:46px;font-weight:600;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere;transition:none}
  .ch b{display:block;font:600 34px/1 Georgia,serif;color:#9fb3ff;margin-bottom:14px}
  .ch.win{border-color:#5ad19a;background:rgba(90,209,154,.14)}
  .ch.lose{opacity:.35;text-decoration:line-through;text-decoration-thickness:4px}
  .pans{font-size:var(--afs,84px);font-weight:600;line-height:1.4;margin-top:40px;word-break:keep-all;overflow-wrap:anywhere}
  .pnote{margin-top:36px;font-size:48px;line-height:1.6;color:#d6dbea;word-break:keep-all;overflow-wrap:anywhere}
  .philo .mark,.philo .head{display:none}.pans,.pnote{display:none}.philo .pans,.philo .pnote{display:block}
  /* Bottom half: a Galton board that fills while you think. Drawn, not borrowed. */
  canvas{position:absolute;left:0;top:1000px;width:1080px;height:920px}
  .count{position:absolute;left:0;right:0;top:1180px;text-align:center;font:600 300px/1 Georgia,serif;color:#f5f3ee;text-shadow:0 0 40px rgba(11,16,32,.9)}
  .foot{position:absolute;left:80px;top:1010px;font-size:30px;letter-spacing:.3em;color:#b5bcd0;opacity:.8}
</style></head>
<body><i class="light l1"></i>
<div class="top">
  <div id="quiz"><span class="tag">○×QUIZ</span><div class="q" id="q"></div><div class="ask" id="ask">○か×か？</div><div class="choices"><div class="ch" id="c0"></div><div class="ch" id="c1"></div></div></div>
  <div class="ans" id="ans"><div class="mark" id="mark"></div><div class="head" id="head"></div><span class="tag" id="atag">答え</span><div class="pans" id="pans"></div><div class="pnote" id="pnote"></div><div class="go">続きはチャンネルのリンクから</div></div>
</div>
<canvas id="c" width="1080" height="920"></canvas>
<div class="count" id="count"></div>
<div class="foot">ムートン</div>
<script>
let D={};
// Seeded random, so each video is different but the same input always gives the same video.
let seed=1;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const W=1080,H=920,G=2000,R=10,PR=6,ROWS=10,DX=70,DY=58,TOP=110,BIN=TOP+ROWS*DY+10,FLOOR=H-30;
const pegs=[];for(let r=0;r<ROWS;r++)for(let k=0;k<=r;k++)pegs.push({x:W/2+(k-r/2)*DX,y:TOP+r*DY});
const bins=new Array(ROWS+1).fill(0),balls=[];let last=0,next=0;
const binX=i=>W/2+(i-ROWS/2)*DX;
function step(dt){
 for(const b of balls){
  if(b.done)continue;
  b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.slot){if(b.y>=b.slot.y){b.y=b.slot.y;b.x=b.slot.x;b.done=true;}else b.x+=(b.slot.x-b.x)*.25;continue;}
  for(const p of pegs){const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);
   if(d<R+PR&&d>0){const nx=dx/d,ny=dy/d;b.x=p.x+nx*(R+PR);b.y=p.y+ny*(R+PR);const vn=b.vx*nx+b.vy*ny;
    if(vn<0){b.vx-=1.3*vn*nx;b.vy-=1.3*vn*ny;b.vx+=(rnd()-.5)*60;}}}
  b.vx=Math.max(-240,Math.min(240,b.vx*.99));
  if(b.y>BIN){const i=Math.max(0,Math.min(ROWS,Math.round((b.x-W/2)/DX+ROWS/2)));const n=bins[i]++;
   // three balls across each bin, offset row by row
   const row=Math.floor(n/3),col=n%3;b.slot={x:binX(i)+(col-1)*(2*R+1)+(row%2?R/2:0),y:FLOOR-R-row*(2*R-2)};}
 }
}
function spawn(){balls.push({x:W/2+(rnd()-.5)*4,y:20,vx:(rnd()-.5)*30,vy:0,born:last});}
function draw(){
 const c=document.getElementById('c').getContext('2d');c.clearRect(0,0,W,H);
 c.strokeStyle='rgba(181,188,208,.25)';c.lineWidth=2;
 for(let i=0;i<=ROWS+1;i++){const x=binX(i-.5);c.beginPath();c.moveTo(x,BIN+20);c.lineTo(x,FLOOR);c.stroke();}
 c.beginPath();c.moveTo(binX(-.5)-10,FLOOR);c.lineTo(binX(ROWS+.5)+10,FLOOR);c.stroke();
 c.fillStyle='rgba(181,188,208,.55)';for(const p of pegs){c.beginPath();c.arc(p.x,p.y,PR,0,7);c.fill();}
 for(const b of balls){const age=last-b.born;c.fillStyle=b.done?'#4c72ff':'#9fb3ff';c.shadowColor='#4c72ff';c.shadowBlur=b.done?0:18;
  c.beginPath();c.arc(b.x,b.y,R,0,7);c.fill();}
 c.shadowBlur=0;
}
// Timeline (seconds): countdown starts at C, answer at C+3, back to the question from E-0.5.
let C=7,E=15,P=false;
window.setup=d=>{D=d;seed=d.seed>>>0||1;
 if(d.choices){P=true;C=9;E=18;document.body.classList.add('philo');document.querySelector('#quiz .tag').textContent=d.hook;
  d.choices.forEach((h,i)=>{const el=document.getElementById('c'+i);el.innerHTML='<b>'+'AB'[i]+'</b>'+h;if(h.replace(/<[^>]+>/g,'').length>7)el.style.fontSize='40px';});
  document.getElementById('pans').innerHTML=d.ansHtml;document.getElementById('pnote').innerHTML=d.noteHtml;
  const L=d.ansHtml.replace(/<[^>]+>/g,'').length;document.getElementById('pans').style.setProperty('--afs',(L>12?72:84)+'px');
  document.getElementById('atag').style.display='inline-block';}
 else document.getElementById('atag').style.display='none';const q=document.getElementById('q');q.innerHTML=d.qHtml;const n=d.q.length;q.style.setProperty('--fs',(P?(n>50?54:58):n>60?58:n>34?64:72)+'px');
 const m=document.getElementById('mark');m.textContent=d.a?'○':'×';m.className='mark '+(d.a?'o':'x');document.getElementById('head').innerHTML=d.headHtml;};
// Called once per frame, in order. t in seconds.
// 0–0.5 fade in; C–C+3 countdown; C+3 answer; E-0.5–E back to the question so the loop joins up.
window.frame=t=>{
 const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
 while(next<=t){spawn();next+=.09;}
 const sub=8,dt=(t-last)/sub;for(let i=0;i<sub;i++)step(dt);last=t;draw();
 const A=C+3,S=P?A+1.2:A;  // in two-choice mode, show which card wins for 1.2s before the answer
 const inT=ease(t/.5),outT=ease((t-(E-.5))/.5);
 const quiz=document.getElementById('quiz'),a=document.getElementById('ans'),at=ease((t-S)/.35);
 quiz.style.cssText=`opacity:${t<S?inT:t<E-.5?0:outT};transform:translateY(${(1-inT)*20}px)`;
 a.style.opacity=t<E-.5?at:1-outT;
 if(P){for(let i=0;i<2;i++){const el=document.getElementById('c'+i);el.className='ch'+(t>=A&&t<E-.5?(D.pick===i?' win':' lose'):'');}}
 const m=document.getElementById('mark');m.style.transformOrigin='left center';
 m.style.transform=`scale(${t<A?0.4:0.4+0.6*at+(t<A+.5?Math.sin((t-A)*12)*.06*(1-at):0)})`;
 const c=document.getElementById('count');
 if(t>=C&&t<A){const k=Math.floor(t-C),f=(t-C)%1;c.textContent=3-k;c.style.opacity=1-f*.6;c.style.transform=`scale(${1.25-f*.25})`;}else c.textContent='';
};
</script></body></html>
