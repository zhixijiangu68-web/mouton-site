<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/300.css">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/500.css">
<style>
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
  body{background:#f8f5ee;color:#1b1c19;font-family:"Noto Serif JP",serif;position:relative}
  .band{position:absolute;inset:0 0 auto 0;height:18px;background:linear-gradient(90deg,#0b2f97,#1442c4 60%,#4f86e0)}
  .sun{position:absolute;right:-160px;top:-180px;width:640px;height:640px;border-radius:50%;
       background:radial-gradient(circle,rgba(242,214,150,.8) 0 18%,rgba(242,214,150,.22) 38%,transparent 62%)}
  .wrap{position:absolute;inset:110px 96px 96px 96px;display:flex;flex-direction:column}
  .tag{align-self:flex-start;font-family:Georgia,serif;font-size:30px;letter-spacing:.22em;padding:8px 24px;border-radius:999px;background:#1b1c19;color:#fff}
  .tag.word{background:none;color:#1442c4;font-style:italic;letter-spacing:.04em;padding:0;font-size:36px}
  h1{margin:auto 0;font-weight:500;font-size:var(--fs,72px);line-height:1.6;letter-spacing:.03em;word-break:keep-all;overflow-wrap:anywhere;}
  .ask{display:none;font-size:64px;color:#1442c4;margin-top:-40px;margin-bottom:auto}
  body.ox .ask{display:block}
  body.quiz h1{margin-bottom:60px}
  .hint{font-size:30px;color:#5b5d56;font-weight:300;margin-bottom:40px}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:34px;letter-spacing:.3em;font-weight:300}
  .foot small{font-family:Georgia,serif;font-style:italic;letter-spacing:.04em;font-size:28px;color:#5b5d56}
</style></head>
<body><div class="band"></div><div class="sun"></div>
<div class="wrap"><span class="tag" id="tag"></span><h1 id="title"></h1><div class="ask">○か×か？</div><div class="hint" id="hint"></div>
<div class="foot"><span>ムートン</span><small>moutonarchive.com</small></div></div>
<script>
window.render = ({ text, html, kind, hint, ox }) => {
  document.body.classList.toggle('quiz', kind === 'quiz');
  document.body.classList.toggle('ox', !!ox);
  const tag = document.getElementById('tag');
  tag.className = 'tag' + (kind === 'quiz' ? '' : ' word');
  tag.textContent = kind === 'quiz' ? 'QUIZ' : kind === 'philosophy' ? 'Philosophy' : 'Mouton';
  document.getElementById('hint').textContent = hint || '';
  const h = document.getElementById('title');
  h.innerHTML = html || text;
  const len = text.replace(/\s/g, '').length;
  h.style.setProperty('--fs', (len > 90 ? 50 : len > 64 ? 56 : len > 44 ? 64 : len > 28 ? 72 : 84) + 'px');
};
</script></body></html>
