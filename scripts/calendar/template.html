<title>ムートン運用カレンダー</title>
<!-- 生成物: scripts/calendar/make.mjs が promo/x-posts.md から作る。直接編集しない -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 左に小さな月と進み具合、中央に「日・週・月」を切り替える予定表、右（スマホは下から出るシート）に予定の中身。
   色は「どこで」：X＝藍、Claude＝青緑、管理画面＝黄土。赤い線は今の時刻。 */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --sunk: #eef0ed;
  --ink: #1b1f22;
  --muted: #6b7378;
  --faint: #a3aaae;
  --line: #e4e7e3;
  --x: #4651b5;
  --x-soft: #e8eafb;
  --claude: #1d776f;
  --claude-soft: #dcefec;
  --admin: #a8680f;
  --admin-soft: #f7ecd9;
  --done: #2f7d4a;
  --now: #e2453c;
  --shadow: 0 1px 2px rgb(20 30 40 / 0.05), 0 8px 24px rgb(20 30 40 / 0.06);
  --f-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --hour: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --surface: #191d20; --sunk: #14181a; --ink: #e8ebe9; --muted: #9aa3a8; --faint: #5f686d; --line: #2a3034;
    --x: #a9b0ff; --x-soft: #262a4a; --claude: #78cdc3; --claude-soft: #183633; --admin: #e8b464; --admin-soft: #3a2e1a;
    --done: #7fd39a; --now: #ff6b61; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --surface: #191d20; --sunk: #14181a; --ink: #e8ebe9; --muted: #9aa3a8; --faint: #5f686d; --line: #2a3034;
  --x: #a9b0ff; --x-soft: #262a4a; --claude: #78cdc3; --claude-soft: #183633; --admin: #e8b464; --admin-soft: #3a2e1a;
  --done: #7fd39a; --now: #ff6b61; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--x); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

.app { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .app { grid-template-columns: 252px minmax(0, 1fr) 360px; align-items: start; } }

/* 左：小さな月・進み具合 */
.side { display: none; }
@media (min-width: 1100px) { .side { display: grid; gap: 22px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); } }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 1.375rem; line-height: 1.35; }
.brand p { margin: 4px 0 0; font-size: 0.8125rem; color: var(--muted); }
.mini-head { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 0.875rem; }
.mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 8px; text-align: center; }
.mini .w { font-size: 0.6875rem; color: var(--faint); padding-bottom: 2px; }
.mini button { border: none; background: none; aspect-ratio: 1; border-radius: 50%; font-family: var(--f-mono); font-size: 0.75rem; cursor: pointer; position: relative; transition: background .2s var(--ease); font-variant-numeric: tabular-nums; }
.mini button:hover { background: var(--sunk); }
.mini button.out { color: var(--faint); cursor: default; }
.mini button.wk { background: var(--sunk); border-radius: 0; }
.mini button.today { background: var(--now); color: #fff; border-radius: 50%; }
.mini button.cur:not(.today) { box-shadow: inset 0 0 0 1.5px var(--ink); border-radius: 50%; }
.mini button i { position: absolute; left: 50%; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; transform: translateX(-50%); background: var(--x); }
.mini button.today i { background: #fff; }
.prog { display: grid; gap: 10px; }
.prog-row { display: flex; justify-content: space-between; font-size: 0.8125rem; color: var(--muted); }
.prog-row b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--x); border-radius: 99px; transition: width .6s var(--ease); }
.legend { display: grid; gap: 6px; font-size: 0.8125rem; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.dot.x { background: var(--x); } .dot.c { background: var(--claude); } .dot.a { background: var(--admin); }
.theme-card { font-size: 0.8125rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.theme-card b { display: block; color: var(--ink); font-size: 0.75rem; letter-spacing: 0.06em; }

/* 中央：予定表 */
.main { min-width: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 16px 18px 12px; }
.bar-top h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.375rem; letter-spacing: 0.01em; min-width: 0; }
.bar-top h2 small { font-family: var(--f-body); font-weight: 400; font-size: 0.8125rem; color: var(--muted); margin-left: 6px; }
.nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.icon { width: 34px; height: 34px; border-radius: 50%; border: none; background: none; cursor: pointer; display: grid; place-items: center; transition: background .2s var(--ease), transform .15s var(--ease); }
.icon:hover { background: var(--sunk); }
.icon:active { transform: scale(.92); }
.icon:disabled { opacity: .3; cursor: default; background: none; }
.icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 14px; font-size: 0.8125rem; cursor: pointer; transition: background .2s var(--ease); }
.pill:hover { background: var(--sunk); }
.seg { position: relative; display: inline-grid; grid-template-columns: repeat(3, 1fr); background: var(--sunk); border-radius: 99px; padding: 3px; }
.seg button { position: relative; z-index: 1; border: none; background: none; padding: 5px 16px; font-size: 0.8125rem; cursor: pointer; border-radius: 99px; transition: color .25s var(--ease); color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.seg .ind { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 99px; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .12); transition: transform .35s var(--ease); }
.mobile-prog { display: flex; gap: 14px; align-items: center; padding: 0 18px 12px; font-size: 0.75rem; color: var(--muted); }
.mobile-prog .bar { flex: 1; }
.mobile-prog b { font-family: var(--f-mono); color: var(--ink); font-weight: 500; }
@media (min-width: 1100px) { .mobile-prog { display: none; } }

.cal { view-transition-name: cal; touch-action: pan-y; }

/* 時間軸（日・週） */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 12px 10px; }
.strip button { border: none; background: none; border-radius: 12px; padding: 6px 0 8px; cursor: pointer; display: grid; justify-items: center; gap: 2px; transition: background .2s var(--ease); }
.strip button:hover { background: var(--sunk); }
.strip .dw { font-size: 0.6875rem; color: var(--muted); }
.strip .dn { font-family: var(--f-mono); font-size: 1rem; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; transition: background .25s var(--ease), color .25s var(--ease); }
.strip .on .dn { background: var(--ink); color: var(--surface); }
.strip .today .dn { color: var(--now); font-weight: 500; }
.strip .on.today .dn { background: var(--now); color: #fff; }
.strip .out { opacity: .35; pointer-events: none; }
.dots { display: flex; gap: 3px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; }
.dots i.x { background: var(--x); } .dots i.c { background: var(--claude); } .dots i.a { background: var(--admin); }
.dots i.ok { opacity: .35; }

.tg-head { display: grid; grid-template-columns: 52px repeat(var(--cols), minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.tg-head button { border: none; background: none; padding: 4px 0 10px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
.tg-head .dw { font-size: 0.6875rem; color: var(--muted); }
.tg-head .dn { font-family: var(--f-mono); font-size: 1.0625rem; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; transition: background .25s var(--ease); }
.tg-head button:hover .dn { background: var(--sunk); }
.tg-head .today .dn { background: var(--now); color: #fff; }
.tg-head .out { opacity: .35; pointer-events: none; }
.tg-body { height: min(calc(100vh - 190px), 900px); min-height: 420px; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; position: relative; }
.tg-grid { display: grid; grid-template-columns: 52px repeat(var(--cols), minmax(0, 1fr)); position: relative; height: calc(var(--hour) * var(--span)); }
.hours { position: relative; }
.hours span { position: absolute; right: 8px; transform: translateY(-50%); font-family: var(--f-mono); font-size: 0.6875rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% var(--hour); }
.col.today { background-color: color-mix(in srgb, var(--now) 4%, transparent); }
.col.out { background-color: var(--sunk); }
.ev { position: absolute; border: none; text-align: left; border-radius: 8px; padding: 4px 7px; cursor: pointer; overflow: hidden; line-height: 1.3; border-left: 3px solid; transition: transform .2s var(--ease), box-shadow .2s var(--ease), opacity .2s; animation: pop .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 25ms); }
.ev:hover { transform: translateY(-1px); box-shadow: var(--shadow); z-index: 3; }
.ev.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px currentColor; z-index: 4; }
.ev.x { background: var(--x-soft); border-color: var(--x); color: var(--x); }
.ev.c { background: var(--claude-soft); border-color: var(--claude); color: var(--claude); }
.ev.a { background: var(--admin-soft); border-color: var(--admin); color: var(--admin); }
.ev.ok { opacity: .55; }
.ev .tm { display: flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 0.6875rem; }
.ev .tm em { font-style: normal; font-family: var(--f-body); font-weight: 700; font-size: 0.625rem; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; white-space: nowrap; }
.ev .tm .ck { margin-left: auto; color: var(--done); font-weight: 700; }
.ev .tt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink); font-size: 0.75rem; font-weight: 500; margin-top: 1px; }
.narrow-week .ev { padding: 3px 4px; }
.narrow-week .ev .tm em, .narrow-week .ev .tm span { display: none; }
.nowline { position: absolute; left: -1px; right: 0; height: 2px; background: var(--now); z-index: 5; pointer-events: none; transition: top 1s linear; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
.nowlabel { position: absolute; right: 4px; transform: translateY(-50%); font-family: var(--f-mono); font-size: 0.6875rem; color: #fff; background: var(--now); border-radius: 4px; padding: 0 4px; z-index: 6; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }

/* 月 */
.mo-dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 0 12px; font-size: 0.6875rem; color: var(--muted); text-align: center; }
.mo { padding: 4px 12px 14px; display: grid; gap: 0; }
.mo-wk { font-size: 0.6875rem; color: var(--muted); padding: 10px 4px 4px; display: flex; gap: 8px; align-items: baseline; }
.mo-wk b { color: var(--claude); letter-spacing: .06em; flex: none; }
.mo-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.mo-cell { min-width: 0; min-height: 104px; border: none; border-left: 1px solid var(--line); background: none; text-align: left; padding: 6px 5px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; transition: background .2s var(--ease); animation: pop .4s var(--ease) both; animation-delay: calc(var(--i, 0) * 8ms); }
.mo-cell:first-child { border-left: none; }
.mo-cell:hover { background: var(--sunk); }
.mo-cell.out { cursor: default; background: none; }
.mo-cell.out .mn { color: var(--faint); }
.mo-cell.past { opacity: .62; }
.mn { font-family: var(--f-mono); font-size: 0.8125rem; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; flex: none; }
.mo-cell.today .mn { background: var(--now); color: #fff; }
.mo-cell.on:not(.today) .mn { background: var(--ink); color: var(--surface); }
.mp { display: flex; gap: 4px; align-items: center; font-size: 0.6875rem; line-height: 1.45; border-radius: 4px; padding: 0 4px; min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; }
.mp span { overflow: hidden; text-overflow: ellipsis; }
.mp.x { background: var(--x-soft); } .mp.c { background: var(--claude-soft); } .mp.a { background: var(--admin-soft); }
.mp.ok span { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted); }
.mo-cell .dots { display: none; }
@media (max-width: 700px) {
  .mo-cell { min-height: 60px; align-items: center; padding: 4px 2px; }
  .mo-cell .mp { display: none; }
  .mo-cell .dots { display: flex; flex-wrap: wrap; justify-content: center; height: auto; }
}

/* 右：予定の中身 */
.panel { min-width: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 20px 20px 16px; }
@media (min-width: 1100px) { .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); max-height: calc(100vh - 40px); overflow-y: auto; } .grab, .close { display: none; } }
@media (max-width: 1099px) {
  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 82vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 8px 18px calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateY(105%); transition: transform .45s var(--ease); visibility: hidden; }
  .panel.open { transform: none; visibility: visible; }
  .scrim { position: fixed; inset: 0; z-index: 19; background: rgb(0 0 0 / .32); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
  .scrim.open { opacity: 1; pointer-events: auto; }
}
@media (min-width: 1100px) { .scrim { display: none; } }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 10px; }
.close { float: right; }
.p-date { font-size: 0.8125rem; color: var(--muted); }
.p-title { font-size: 1.125rem; font-weight: 700; line-height: 1.5; margin-top: 4px; }
.p-time { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 8px; font-size: 0.8125rem; color: var(--muted); }
.p-time b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 700; border-radius: 99px; padding: 1px 10px; }
.tag.x { background: var(--x-soft); color: var(--x); } .tag.c { background: var(--claude-soft); color: var(--claude); } .tag.a { background: var(--admin-soft); color: var(--admin); }
.meta { font-size: 0.8125rem; color: var(--muted); margin: 10px 0 0; }
.meta code { font-family: var(--f-mono); font-size: 0.75rem; }
.steps { margin: 14px 0 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 8px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 0.875rem; }
.steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-family: var(--f-mono); font-size: 0.6875rem; color: var(--muted); }
.copy { margin-top: 14px; }
.copy-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--muted); letter-spacing: .04em; }
.copy pre { margin: 6px 0 0; padding: 12px 14px; background: var(--sunk); border-radius: 10px; font-family: var(--f-body); font-size: 0.875rem; line-height: 1.75; white-space: pre-wrap; word-break: break-all; }
.cbtn { border: none; background: var(--ink); color: var(--surface); border-radius: 99px; padding: 3px 12px; font-size: 0.75rem; cursor: pointer; transition: transform .15s var(--ease), background .2s; }
.cbtn:active { transform: scale(.94); }
.cbtn.ok { background: var(--done); }
.opts { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.opts li { font-size: 0.875rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px; }
.done-btn { margin-top: 16px; width: 100%; border: 1.5px solid var(--line); background: none; border-radius: 12px; padding: 10px; font-size: 0.875rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: background .25s var(--ease), border-color .25s var(--ease), color .25s; }
.done-btn:hover { border-color: var(--done); }
.done-btn[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: #fff; }
.posted { margin-top: 12px; color: var(--done); font-weight: 700; font-size: 0.8125rem; }
.agenda { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 4px; }
.agenda button { width: 100%; border: none; background: none; text-align: left; display: grid; grid-template-columns: 44px 3px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 6px; border-radius: 10px; cursor: pointer; transition: background .2s var(--ease); }
.agenda button:hover { background: var(--sunk); }
.agenda .t { font-family: var(--f-mono); font-size: 0.8125rem; color: var(--muted); }
.agenda .b { align-self: stretch; border-radius: 2px; }
.agenda .b.x { background: var(--x); } .agenda .b.c { background: var(--claude); } .agenda .b.a { background: var(--admin); }
.agenda .n { font-size: 0.875rem; font-weight: 500; }
.agenda .n small { display: block; color: var(--muted); font-weight: 400; font-size: 0.75rem; }
.agenda .ok .n { color: var(--muted); text-decoration: line-through; }
.back { border: none; background: none; color: var(--muted); font-size: 0.8125rem; cursor: pointer; padding: 0; margin-bottom: 8px; }
.back:hover { color: var(--ink); }
.foot { grid-column: 1 / -1; font-size: 0.75rem; color: var(--muted); text-align: center; margin: 0; }
.foot code { font-family: var(--f-mono); }
.fade { animation: fadeUp .35s var(--ease) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }

/* 画面の切り替え（対応ブラウザだけ） */
::view-transition-old(cal), ::view-transition-new(cal) { animation-duration: .36s; animation-timing-function: var(--ease); }
:root[data-dir="next"]::view-transition-old(cal) { animation-name: outL; }
:root[data-dir="next"]::view-transition-new(cal) { animation-name: inR; }
:root[data-dir="prev"]::view-transition-old(cal) { animation-name: outR; }
:root[data-dir="prev"]::view-transition-new(cal) { animation-name: inL; }
@keyframes outL { to { opacity: 0; transform: translateX(-40px); } }
@keyframes inR { from { opacity: 0; transform: translateX(40px); } }
@keyframes outR { to { opacity: 0; transform: translateX(40px); } }
@keyframes inL { from { opacity: 0; transform: translateX(-40px); } }
@media (prefers-reduced-motion: reduce) {
  *, ::view-transition-old(cal), ::view-transition-new(cal) { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

<div class="app">
  <aside class="side" aria-label="概要">
    <div class="brand">
      <h1>ムートン運用カレンダー</h1>
      <p>X に投稿 → 「選び方」の記事 → Amazon・楽天。10月中に最初の1件を売る</p>
    </div>
    <div id="mini"></div>
    <div class="prog" id="prog"></div>
    <div class="theme-card" id="theme"></div>
    <div class="legend">
      <span><i class="dot x"></i>X で投稿する</span>
      <span><i class="dot c"></i>Claude に送る・渡す</span>
      <span><i class="dot a"></i>管理画面で数字を見る</span>
    </div>
  </aside>

  <main class="main">
    <div class="bar-top">
      <h2 id="title"></h2>
      <div class="nav">
        <button type="button" class="pill" id="today">今日</button>
        <button type="button" class="icon" id="prev" aria-label="前へ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button type="button" class="icon" id="next" aria-label="次へ"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="seg" role="group" aria-label="表示">
        <span class="ind" id="ind"></span>
        <button type="button" data-view="day">日</button>
        <button type="button" data-view="week">週</button>
        <button type="button" data-view="month">月</button>
      </div>
    </div>
    <div class="mobile-prog" id="mprog"></div>
    <div class="cal" id="cal"></div>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-live="polite"></aside>

  <p class="foot" id="foot"></p>
</div>

<script>
const DATA = /*DATA*/null;

const WEEKS = [
  { from: "2026-10-06", to: "2026-10-12", n: 1, text: "計る準備と X の開始。選び方9本の点検" },
  { from: "2026-10-13", to: "2026-10-19", n: 2, text: "クリックが集まる記事を1本選んで磨く。読み物から選び方へのリンクを足す" },
  { from: "2026-10-20", to: "2026-10-26", n: 3, text: "伸びた投稿の型で X の案を足す。必要なら選び方の記事を1本追加" },
  { from: "2026-10-27", to: "2026-11-05", n: 4, text: "10/31 で締め。売れた・売れなかった理由を数字で出し、11月の計画を作る" },
];

const SOURCES = "X のアナリティクス、GA4（集客 → トラフィック獲得の x / social、affiliate_click）、Amazon アソシエイト・楽天のレポート";
// 決まった予定（時刻は0時からの分。where: X / Claude / 管理画面）
const EVENTS = {
  "2026-10-12": [{ start: 480, end: 540, where: "Claude", title: "週の振り返り", steps: [SOURCES + "のスクショを Claude に渡す", "「週の振り返り」と送る", "出てきた今週の3つを確認する"] }],
  "2026-10-19": [{ start: 480, end: 540, where: "Claude", title: "週の振り返り", steps: [SOURCES + "のスクショを Claude に渡す", "「週の振り返り」と送る", "どの記事にクリックが集まったかを見て、磨く記事を決める"] }],
  "2026-10-26": [{ start: 480, end: 540, where: "Claude", title: "週の振り返り", steps: [SOURCES + "のスクショを Claude に渡す", "「週の振り返り」と送る", "伸びた投稿の型を確認し、最終週の案を承認する"] }],
  "2026-10-31": [{ start: 1320, end: 1350, where: "Claude", title: "10月の締め", steps: ["夜の投稿で10月の順番表はおしまい", "売れた日があれば Claude に日付を伝えて記録する"] }],
  "2026-11-01": [{ start: 720, end: 780, where: "管理画面", title: "10月の数字を集める", steps: ["Amazon アソシエイト・楽天のレポートで、10月の注文（売れた商品・日付）を確認する", "GA4 と X のアナリティクスで10月分をスクショか CSV にする"] }],
  "2026-11-02": [{ start: 480, end: 540, where: "Claude", title: "10月の振り返り", steps: ["集めた数字を Claude に渡し、「10月の振り返り」と送る", "どの記事から売れたか、売れなかった理由を数字で出してもらう"] }],
  "2026-11-05": [{ start: 600, end: 660, where: "Claude", title: "11月の計画を決める", steps: ["Claude がまとめた11月の計画を読む", "OK なら承認する（承認が必要）"] }],
};
for (const d of ["2026-10-11", "2026-10-18", "2026-10-25"]) {
  EVENTS[d] = [{ start: 720, end: 780, where: "管理画面", title: "1週間の数字を撮る", steps: [SOURCES + "を開く", "この1週間の分をスクショか CSV にして、明日の朝 Claude に渡せるようにしておく"] }];
}

const START_H = 6, END_H = 23;
const PLACE = { X: "x", Claude: "c", "管理画面": "a" };
const DOW = ["日", "月", "火", "水", "木", "金", "土"];
const RANGE = { from: "2026-10-06", to: "2026-11-05" };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const byDate = {};
for (const s of DATA.slots) (byDate[s.date] ||= []).push(s);

const iso = (d) => d.toISOString().slice(0, 10);
const parse = (s) => new Date(s + "T00:00:00Z");
const addDays = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const dnum = (s) => parse(s).getUTCDate();
const mon = (s) => parse(s).getUTCMonth() + 1;
const dow = (s) => DOW[parse(s).getUTCDay()];
const md = (s) => `${mon(s)}月${dnum(s)}日（${dow(s)}）`;
const mondayOf = (s) => addDays(s, -((parse(s).getUTCDay() + 6) % 7));
const inRange = (s) => s >= RANGE.from && s <= RANGE.to;
const clamp = (s) => (s < RANGE.from ? RANGE.from : s > RANGE.to ? RANGE.to : s);
const weekOf = (s) => WEEKS.find((w) => s >= w.from && s <= w.to);
const hm = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

function nowJST() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: Number(p.hour) * 60 + Number(p.minute) };
}
let NOW = nowJST();
const TODAY = NOW.date;

const isPosted = (s) => s.done || store.get(`post-${s.date}-${s.slot}`) === "1";

// その日の予定を時刻つきで作る
function eventsFor(d) {
  if (!inRange(d)) return [];
  const out = [];
  const slots = byDate[d] || [];
  if (slots.length) out.push({ key: "wake", start: 390, end: 420, place: "Claude", title: "「今日の仕事」と送る", sub: "今日の2本を受け取る" });
  for (const p of byDate[addDays(d, -1)] || []) if (p.followup) out.push({ key: "fu", start: 420, end: 450, place: "X", badge: "答え合わせ", title: "投票の答え合わせ", post: p, followup: true });
  for (const s of slots) {
    const [start, end] = s.slot === "朝" ? [420, 480] : [1260, 1320];
    const badge = s.form === "投票" ? "投票" : /引用/.test(s.formNote) ? "答え合わせ" : s.form === "本文リンク" ? "本文リンク" : "リプ";
    out.push({ key: s.slot, start, end, place: "X", badge, title: s.article, post: s, done: isPosted(s) });
  }
  (EVENTS[d] || []).forEach((e, i) => out.push({ key: "ev" + i, start: e.start, end: e.end, place: e.where, title: e.title, ev: e, done: store.get(`ev-${d}-${i}`) === "1" }));
  out.sort((a, b) => a.start - b.start || b.end - a.end);
  // 重なる予定は横に並べる
  const lanes = [];
  for (const e of out) {
    let l = lanes.findIndex((end) => end <= e.start);
    if (l < 0) { l = lanes.length; lanes.push(0); }
    lanes[l] = e.end; e.lane = l;
  }
  for (const e of out) e.lanes = Math.max(...out.filter((o) => o.start < e.end && e.start < o.end).map((o) => o.lane)) + 1;
  return out;
}

// 状態
const wide = () => matchMedia("(min-width: 1100px)").matches;
const narrow = () => matchMedia("(max-width: 700px)").matches;
let view = store.get("view") || (narrow() ? "day" : "week");
if (!["day", "week", "month"].includes(view)) view = "week";
let cursor = clamp(TODAY);
try { const h = location.hash.slice(1); if (/^d\d{4}-\d{2}-\d{2}$/.test(h) && inRange(h.slice(1))) cursor = h.slice(1); } catch {}
let monthOf = mon(cursor);
let selKey = null; // "日付|key"

// ---------- 描画 ----------
function render() {
  renderTitle();
  if (view === "month") renderMonth(); else renderTime();
  renderSide();
  renderPanel();
  document.querySelectorAll(".seg button").forEach((b, i) => {
    b.setAttribute("aria-pressed", b.dataset.view === view);
    if (b.dataset.view === view) document.getElementById("ind").style.transform = `translateX(${i * 100}%)`;
  });
  try { history.replaceState(null, "", "#d" + cursor); } catch {}
}

function renderTitle() {
  const t = document.getElementById("title");
  if (view === "month") t.innerHTML = `2026年${monthOf}月`;
  else if (view === "week") { const m = mondayOf(cursor), e = addDays(m, 6); t.innerHTML = `${mon(m)}月${dnum(m)}日 – ${mon(e) !== mon(m) ? mon(e) + "月" : ""}${dnum(e)}日`; }
  else t.innerHTML = `${mon(cursor)}月${dnum(cursor)}日<small>${dow(cursor)}曜日${cursor === TODAY ? "・今日" : ""}</small>`;
  const [canPrev, canNext] = view === "month" ? [monthOf > 10, monthOf < 11] : view === "week" ? [mondayOf(cursor) > RANGE.from, addDays(mondayOf(cursor), 6) < RANGE.to] : [cursor > RANGE.from, cursor < RANGE.to];
  document.getElementById("prev").disabled = !canPrev;
  document.getElementById("next").disabled = !canNext;
}

const dotsHtml = (d) => `<span class="dots">${eventsFor(d).filter((e) => e.key !== "wake").map((e) => `<i class="${PLACE[e.place]} ${e.done ? "ok" : ""}"></i>`).join("")}</span>`;

function renderTime() {
  const days = view === "week" ? Array.from({ length: 7 }, (_, i) => addDays(mondayOf(cursor), i)) : [cursor];
  const narrowWeek = view === "week" && narrow();
  let h = "";
  if (view === "day") {
    h += `<div class="strip">${Array.from({ length: 7 }, (_, i) => addDays(mondayOf(cursor), i)).map((d) => `<button type="button" data-day="${d}" class="${d === cursor ? "on" : ""} ${d === TODAY ? "today" : ""} ${inRange(d) ? "" : "out"}" aria-label="${md(d)}"><span class="dw">${dow(d)}</span><span class="dn">${dnum(d)}</span>${dotsHtml(d)}</button>`).join("")}</div>`;
  } else {
    h += `<div class="tg-head" style="--cols:7"><span></span>${days.map((d) => `<button type="button" data-day="${d}" data-go="day" class="${d === TODAY ? "today" : ""} ${inRange(d) ? "" : "out"}" aria-label="${md(d)}を1日で見る"><span class="dw">${dow(d)}</span><span class="dn">${dnum(d)}</span></button>`).join("")}</div>`;
  }
  h += `<div class="tg-body" id="scroller"><div class="tg-grid ${narrowWeek ? "narrow-week" : ""}" style="--cols:${days.length};--span:${END_H - START_H}"><div class="hours">`;
  for (let hr = START_H + 1; hr < END_H; hr++) h += `<span style="top:calc(var(--hour) * ${hr - START_H})">${hr}:00</span>`;
  h += `</div>`;
  let i = 0;
  for (const d of days) {
    h += `<div class="col ${d === TODAY ? "today" : ""} ${inRange(d) ? "" : "out"}">`;
    for (const e of eventsFor(d)) {
      const top = (e.start - START_H * 60) / 60, ht = (e.end - e.start) / 60;
      const w = 100 / e.lanes;
      const sel = selKey === `${d}|${e.key}`;
      h += `<button type="button" class="ev ${PLACE[e.place]} ${e.done ? "ok" : ""} ${sel ? "sel" : ""}" data-day="${d}" data-key="${e.key}" style="--i:${i++};top:calc(var(--hour) * ${top} + 1px);height:calc(var(--hour) * ${ht} - 3px);left:calc(${w * e.lane}% + 3px);width:calc(${w}% - 6px)" aria-label="${hm(e.start)} ${esc(e.place)} ${esc(e.title)}${e.done ? " 済み" : ""}"><span class="tm">${hm(e.start)}${e.badge ? `<em>${esc(e.badge)}</em>` : `<span>${esc(e.place)}</span>`}${e.done ? `<span class="ck">✓</span>` : ""}</span>${ht >= 0.75 || view === "day" ? `<span class="tt">${esc(e.title)}</span>` : ""}</button>`;
    }
    if (d === TODAY && NOW.min >= START_H * 60 && NOW.min < END_H * 60) {
      const top = (NOW.min - START_H * 60) / 60;
      h += `<div class="nowline" style="top:calc(var(--hour) * ${top})"></div>${view === "day" ? `<span class="nowlabel" style="top:calc(var(--hour) * ${top})">${hm(NOW.min)}</span>` : ""}`;
    }
    h += `</div>`;
  }
  h += `</div></div>`;
  document.getElementById("cal").innerHTML = h;
  // 今日は今の時刻、ほかの日は朝6時が見える位置へ
  const sc = document.getElementById("scroller");
  const firstMin = days.includes(TODAY) ? NOW.min - 90 : 0;
  const hour = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour")) || 52;
  sc.style.scrollBehavior = "auto";
  sc.scrollTop = Math.max(0, ((firstMin - START_H * 60) / 60) * hour);
  sc.style.scrollBehavior = "";
}

function renderMonth() {
  const first = `2026-${String(monthOf).padStart(2, "0")}-01`;
  let d = mondayOf(first);
  let h = `<div class="mo-dow">${["月", "火", "水", "木", "金", "土", "日"].map((x) => `<span>${x}</span>`).join("")}</div><div class="mo">`;
  let lastW = null, i = 0;
  for (let row = 0; row < 6; row++) {
    if (!inRange(d) && !inRange(addDays(d, 6)) && !(d < RANGE.from && addDays(d, 6) > RANGE.to)) {
      d = addDays(d, 7);
      if (mon(d) !== monthOf && d > first) break;
      continue;
    }
    const w = weekOf(addDays(d, 3));
    if (w && w !== lastW) { h += `<div class="mo-wk"><b>第${w.n}週</b><span>${esc(w.text)}</span></div>`; lastW = w; }
    h += `<div class="mo-row">`;
    for (let k = 0; k < 7; k++, d = addDays(d, 1)) {
      const evs = eventsFor(d).filter((e) => e.key !== "wake");
      const cls = [inRange(d) ? "" : "out", d < TODAY ? "past" : "", d === TODAY ? "today" : "", d === cursor ? "on" : ""].join(" ");
      h += `<button type="button" class="mo-cell ${cls}" style="--i:${i++}" data-day="${d}" ${inRange(d) ? "" : "disabled"} aria-label="${md(d)} ${evs.map((e) => hm(e.start) + " " + e.title).join("、")}"><span class="mn">${dnum(d)}</span>`;
      for (const e of evs.slice(0, 4)) h += `<span class="mp ${PLACE[e.place]} ${e.done ? "ok" : ""}" title="${hm(e.start)} ${esc(e.title)}"><span>${esc(e.badge === "投票" ? "投票：" + e.title : e.title)}</span></span>`;
      h += `${dotsHtml(d)}</button>`;
    }
    h += `</div>`;
    if (mon(d) !== monthOf) break;
  }
  h += `</div>`;
  document.getElementById("cal").innerHTML = h;
}

function renderSide() {
  const posted = DATA.slots.filter(isPosted).length;
  const total = DATA.slots.length;
  const daysLeft = Math.max(0, Math.round((parse("2026-10-31") - parse(TODAY)) / 864e5));
  const pct = Math.round((posted / total) * 100);
  document.getElementById("prog").innerHTML = `<div class="prog-row"><span>投稿</span><span><b>${posted}</b> / ${total}本</span></div><div class="bar"><span style="width:${pct}%"></span></div><div class="prog-row"><span>10/31 まで</span><span><b>${daysLeft}</b>日</span></div>`;
  document.getElementById("mprog").innerHTML = `<span>投稿 <b>${posted}</b>/${total}</span><div class="bar"><span style="width:${pct}%"></span></div><span>10/31 まで <b>${daysLeft}</b>日</span>`;
  const w = weekOf(cursor);
  document.getElementById("theme").innerHTML = w ? `<b>第${w.n}週の目標</b>${esc(w.text)}` : "";
  // 小さな月
  const m = view === "month" ? monthOf : mon(cursor), first = `2026-${String(m).padStart(2, "0")}-01`;
  let d = mondayOf(first), h = `<div class="mini-head"><span>2026年${m}月</span></div><div class="mini">${["月", "火", "水", "木", "金", "土", "日"].map((x) => `<span class="w">${x}</span>`).join("")}`;
  const wk = mondayOf(cursor);
  for (let k = 0; k < 42; k++, d = addDays(d, 1)) {
    if (k % 7 === 0 && k > 0 && mon(d) !== m) break;
    const has = (byDate[d] || []).length || EVENTS[d];
    const inWk = view === "week" && d >= wk && d <= addDays(wk, 6);
    h += `<button type="button" data-day="${d}" class="${mon(d) !== m || !inRange(d) ? "out" : ""} ${d === TODAY ? "today" : ""} ${d === cursor ? "cur" : ""} ${inWk ? "wk" : ""}" ${inRange(d) ? "" : "disabled"} aria-label="${md(d)}">${dnum(d)}${has && inRange(d) ? "<i></i>" : ""}</button>`;
  }
  document.getElementById("mini").innerHTML = h + `</div>`;
}

// ---------- 右の中身 ----------
const copyTexts = {};
function copyBlock(label, text, key) {
  copyTexts[key] = text;
  return `<div class="copy"><div class="copy-head"><span>${esc(label)}</span><button type="button" class="cbtn" data-copy="${key}">コピー</button></div><pre id="pre-${key}">${esc(text)}</pre></div>`;
}
function stepsFor(s) {
  const quote = /引用/.test(s.formNote);
  if (s.form === "投票") return ["X で「投票」を付けた投稿を作る", "本文を貼り、選択肢を入れる。期間は1日", "リンクは付けない"];
  const first = quote ? "前の晩の投票を開き、「引用」で投稿を作る" : "X で新しい投稿を作る";
  if (s.form === "本文リンク") return [first, "本文をそのまま貼る（最後のリンクは消さない）", "リプライはしない"];
  return [first, "本文を貼って投稿する（リンクは入れない）", "すぐ自分の投稿に返信して、リプライの1行を貼る"];
}

function renderPanel() {
  const p = document.getElementById("panel");
  const [d, key] = selKey ? selKey.split("|") : [cursor, null];
  const e = key ? eventsFor(d).find((x) => x.key === key) : null;
  let h = `<div class="grab"></div><button type="button" class="icon close" id="close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  if (!e) {
    const evs = eventsFor(d);
    const w = weekOf(d);
    h += `<div class="fade"><div class="p-date">${w ? `第${w.n}週` : ""}${d === TODAY ? "・今日" : ""}</div><h3 class="p-title">${md(d)}の予定</h3>`;
    h += evs.length ? `<ul class="agenda">${evs.map((x) => `<li><button type="button" class="${x.done ? "ok" : ""}" data-day="${d}" data-key="${x.key}"><span class="t">${hm(x.start)}</span><span class="b ${PLACE[x.place]}"></span><span class="n">${esc(x.title)}<small>${esc(x.place)}${x.badge ? "・" + esc(x.badge) : ""}${x.done ? "・済み" : ""}</small></span></button></li>`).join("")}</ul>` : `<p class="meta">この日は決まった予定がありません。</p>`;
    h += `</div>`;
  } else {
    const s = e.post;
    h += `<div class="fade"><button type="button" class="back" id="back">← ${mon(d)}/${dnum(d)} の予定一覧</button>`;
    h += `<div class="p-date">${md(d)}</div><h3 class="p-title">${esc(e.title)}</h3>`;
    h += `<div class="p-time"><span class="tag ${PLACE[e.place]}">${esc(e.place)}</span><b>${hm(e.start)} – ${hm(e.end)}</b>${e.badge ? `<span>${esc(e.badge)}</span>` : ""}</div>`;
    if (e.key === "wake") {
      h += `<ol class="steps"><li>Claude に「今日の仕事」と送る</li><li>昨日の2本を投稿したかを伝える</li><li>今日の2本（そのまま貼れる本文）を受け取る</li></ol>`;
    } else if (e.followup) {
      h += `<p class="meta">前の晩の投票 <code>${esc(s.id)}</code> へのリプライとして投稿する（枠は使わない）</p>`;
      h += copyBlock("答え合わせ", s.followup, `${d}-fu`);
    } else if (s) {
      const k = `${s.date}-${s.slot}`;
      h += `<p class="meta"><code>${esc(s.id)}</code>・${esc(s.kind)}${s.angle ? `・${esc(s.angle)}` : ""}</p>`;
      if (s.done) h += `<p class="posted">✓ 投稿済み（順番表に記録あり）</p>`;
      h += `<ol class="steps">${stepsFor(s).map((t) => `<li>${esc(t)}</li>`).join("")}</ol>`;
      if (/^【PR】/.test(s.body)) h += `<p class="meta">【PR】を消さずに投稿する</p>`;
      if (s.body) h += copyBlock("本文", s.body, k + "-b");
      if (s.options.length) h += `<div class="copy"><div class="copy-head"><span>投票の選択肢（期間は1日）</span></div><ul class="opts">${s.options.map((o) => `<li>${esc(o)}</li>`).join("")}</ul></div>`;
      if (s.reply && s.form === "リプリンク") h += copyBlock("リプライ（自分の投稿に返信）", s.reply, k + "-r");
      if (!s.done) h += `<button type="button" class="done-btn" data-done="post-${k}" aria-pressed="${!!e.done}">${e.done ? "✓ 投稿した" : "投稿したらここを押す"}</button><p class="meta">この端末にだけ記録されます。Claude にも伝えると順番表に残ります。</p>`;
    } else if (e.ev) {
      const i = Number(e.key.slice(2));
      h += `<ol class="steps">${e.ev.steps.map((t) => `<li>${esc(t)}</li>`).join("")}</ol>`;
      h += `<button type="button" class="done-btn" data-done="ev-${d}-${i}" aria-pressed="${!!e.done}">${e.done ? "✓ やった" : "やったらここを押す"}</button>`;
    }
    h += `</div>`;
  }
  p.innerHTML = h;
}

// ---------- 操作 ----------
function go(fn, dir) {
  const run = () => { fn(); render(); };
  if (document.startViewTransition && !reduced && dir) {
    document.documentElement.dataset.dir = dir;
    document.startViewTransition(run);
  } else run();
}
function step(n) {
  go(() => {
    if (view === "month") { monthOf = Math.min(11, Math.max(10, monthOf + n)); cursor = clamp(`2026-${monthOf}-01`); }
    else cursor = clamp(addDays(cursor, n * (view === "week" ? 7 : 1)));
    selKey = null;
  }, n > 0 ? "next" : "prev");
}
function openPanel(open) {
  document.getElementById("panel").classList.toggle("open", open);
  document.getElementById("scrim").classList.toggle("open", open);
}
function pick(d, key) {
  const dir = d > cursor ? "next" : d < cursor ? "prev" : null;
  const apply = () => { cursor = d; monthOf = mon(d); selKey = key ? `${d}|${key}` : null; };
  if (d !== cursor && view === "day") go(apply, dir); else { apply(); render(); }
  if (!wide()) openPanel(view !== "day" || !!key);
  else if (key) document.getElementById("panel").scrollTop = 0;
}

document.querySelector(".seg").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-view]");
  if (!b || b.dataset.view === view) return;
  const order = ["day", "week", "month"];
  const dir = order.indexOf(b.dataset.view) > order.indexOf(view) ? "next" : "prev";
  go(() => { view = b.dataset.view; monthOf = mon(cursor); selKey = null; store.set("view", view); }, dir);
});
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.getElementById("today").addEventListener("click", () => { const t = clamp(TODAY); go(() => { cursor = t; monthOf = mon(t); selKey = null; }, t > cursor ? "next" : t < cursor ? "prev" : null); });
document.getElementById("scrim").addEventListener("click", () => openPanel(false));

document.addEventListener("click", (ev) => {
  const t = ev.target;
  if (t.closest("#close")) return openPanel(false);
  if (t.closest("#back")) { selKey = null; renderPanel(); document.querySelectorAll(".ev.sel").forEach((x) => x.classList.remove("sel")); return; }
  const c = t.closest("[data-copy]");
  if (c) return copy(c);
  const dn = t.closest("[data-done]");
  if (dn) { store.set(dn.dataset.done, dn.getAttribute("aria-pressed") !== "true" ? "1" : null); render(); return; }
  const b = t.closest("[data-day]");
  if (!b || b.disabled || !b.closest("#cal, #panel, #mini")) return;
  if (b.dataset.go === "day") { const d = b.dataset.day; go(() => { view = "day"; cursor = d; monthOf = mon(d); selKey = null; store.set("view", view); }, "next"); return; }
  pick(b.dataset.day, b.dataset.key || null);
});

function copy(btn) {
  const key = btn.dataset.copy;
  const ok = () => { btn.textContent = "コピーしました"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = "コピー"; btn.classList.remove("ok"); }, 1600); };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById("pre-" + key));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = "選択しました";
  };
  try { navigator.clipboard.writeText(copyTexts[key]).then(ok, fallback); } catch { fallback(); }
}

// 横にスワイプで前後へ
(() => {
  let x0 = null, y0 = 0;
  const cal = document.getElementById("cal");
  cal.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  cal.addEventListener("touchend", (e) => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 50 && !document.getElementById(dx < 0 ? "next" : "prev").disabled) step(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

// 今の時刻の線を動かす
setInterval(() => {
  const n = nowJST();
  if (n.min === NOW.min) return;
  NOW = n;
  document.querySelectorAll(".nowline, .nowlabel").forEach((el) => {
    el.style.top = `calc(var(--hour) * ${(n.min - START_H * 60) / 60})`;
    if (el.classList.contains("nowlabel")) el.textContent = hm(n.min);
  });
}, 20000);

let lastNarrow = narrow();
addEventListener("resize", () => { const n = narrow(); if (n !== lastNarrow) { lastNarrow = n; render(); } if (wide()) openPanel(false); });

render();
document.getElementById("foot").innerHTML = `投稿文と順番表は <code>promo/x-posts.md</code> から作っています（${esc(DATA.generated)} 時点）。時刻は目安です。`;
</script>
