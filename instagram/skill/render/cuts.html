<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/300.css">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/500.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  .layer { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: "Noto Serif JP", serif; }
  body[data-mode="overlay"] #overlay, body[data-mode="end"] #end, body[data-mode="cover"] #overlay { display: flex; }
  body[data-mode="end"], body[data-mode="cover"] { background: #0b0b0c; }
  /* The fixed line: small, white, soft shadow so it reads on any clip. */
  #line { color: #fff; font-weight: 500; font-size: var(--fs, 50px); line-height: 1.5; letter-spacing: .08em; white-space: pre-line; word-break: keep-all;
          text-shadow: 0 0 18px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.7); padding: 0 90px; }
  #end { color: #fff; gap: 34px; }
  #end .t { font-weight: 500; font-size: 52px; line-height: 1.6; letter-spacing: .08em; white-space: pre-line; word-break: keep-all; }
  #end .s { font-weight: 300; font-size: 32px; line-height: 1.7; letter-spacing: .06em; white-space: pre-line; word-break: keep-all; opacity: .75; }
  #end .rule { width: 80px; height: 1px; background: rgba(255,255,255,.5); }
</style>
</head>
<body data-mode="overlay">
<div class="layer" id="overlay"><div id="line"></div></div>
<div class="layer" id="end"><div class="t"></div><div class="rule"></div><div class="s"></div></div>
<script>
window.setup = cfg => {
  const line = document.getElementById('line');
  line.textContent = cfg.text;
  if (cfg.size) line.style.setProperty('--fs', cfg.size + 'px');
  document.querySelector('#end .t').textContent = cfg.end?.text ?? '続きは\nプロフィールのリンクから';
  document.querySelector('#end .s').textContent = cfg.end?.sub ?? '';
  if (!cfg.end?.sub) document.querySelector('#end .rule').style.display = 'none';
};
window.mode = m => { document.body.dataset.mode = m; };
</script>
</body>
</html>
