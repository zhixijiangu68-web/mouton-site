<title>ムートン運用カレンダー</title>
<!-- 生成物: scripts/calendar/make.mjs が promo/x-posts.md から作る。直接編集しない -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 中央に「日・週・月」の予定表、右（広い画面）にその日の予定リスト。スマホは1列で、日の表示がそのまま予定リストになる。
   色は「どこで」：X＝藍、Claude＝青緑、管理画面＝黄土。赤は今。動くのは transform と opacity だけ。 */
:root {
  --bg: #f4f5f3;
  --surface: #ffffff;
  --sunk: #eef0ed;
  --ink: #16191b;
  --muted: #545d62;
  --faint: #8e979c;
  --line: #e1e4e0;
  --x: #3f49ad;
  --x-soft: #e9ebfb;
  --claude: #19706a;
  --claude-soft: #dcefeb;
  --admin: #9a5f0c;
  --admin-soft: #f7ecd8;
  --done: #2b7a45;
  --now: #dc3b32;
  --shadow: 0 1px 2px rgb(20 30 40 / 0.05), 0 6px 20px rgb(20 30 40 / 0.06);
  --f-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --ease: cubic-bezier(.22, .9, .25, 1);
  --hour: 50px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101315; --surface: #181c1f; --sunk: #1f2427; --ink: #eceeed; --muted: #b0b8bc; --faint: #78828a; --line: #2b3135;
    --x: #b1b8ff; --x-soft: #272c4c; --claude: #7fd2c7; --claude-soft: #183834; --admin: #eeba6a; --admin-soft: #3b2f1a;
    --done: #84d69e; --now: #ff6d63; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 20px rgb(0 0 0 / 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101315; --surface: #181c1f; --sunk: #1f2427; --ink: #eceeed; --muted: #b0b8bc; --faint: #78828a; --line: #2b3135;
  --x: #b1b8ff; --x-soft: #272c4c; --claude: #7fd2c7; --claude-soft: #183834; --admin: #eeba6a; --admin-soft: #3b2f1a;
  --done: #84d69e; --now: #ff6d63; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 20px rgb(0 0 0 / 0.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--x); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

.app { max-width: 1360px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1080px) {
  .app { grid-template-columns: minmax(0, 1fr) 400px; align-items: start; }
  .app.solo { grid-template-columns: minmax(0, 760px); justify-content: center; }
  .app.solo .side { display: none; }
}

.head { display: grid; gap: 14px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; line-height: 1.3; }
.goal { display: flex; align-items: center; gap: 12px; font-size: 0.875rem; color: var(--muted); }
.goal b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.meter { width: 120px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 99px; background: var(--x); transform-origin: left; transition: transform .5s var(--ease); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.label { font-family: var(--f-display); font-weight: 600; font-size: 1.375rem; min-width: 0; margin-right: auto; }
.label small { font-family: var(--f-body); font-weight: 400; font-size: 0.875rem; color: var(--muted); margin-left: 8px; }
.nav { display: flex; align-items: center; gap: 2px; }
.icon { width: 40px; height: 40px; border-radius: 50%; border: none; background: none; cursor: pointer; display: grid; place-items: center; transition: background-color .2s, transform .15s var(--ease); }
.icon:hover { background: var(--sunk); }
.icon:active { transform: scale(.9); }
.icon:disabled { opacity: .25; cursor: default; background: none; transform: none; }
.icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 16px; font-size: 0.875rem; cursor: pointer; transition: background-color .2s; }
.pill:hover { background: var(--sunk); }
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sunk); border-radius: 99px; padding: 3px; }
.seg button { position: relative; z-index: 1; border: none; background: none; padding: 6px 20px; font-size: 0.875rem; cursor: pointer; border-radius: 99px; color: var(--muted); transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.seg .ind { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 99px; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .14); transition: transform .4s var(--ease); will-change: transform; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.8125rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 50%; }
.sw.x { background: var(--x); } .sw.c { background: var(--claude); } .sw.a { background: var(--admin); }

.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
.stage { overflow: hidden; touch-action: pan-y; }
.view { will-change: transform, opacity; }

/* ---- 予定リスト（日） ---- */
.day-top { padding: 20px 20px 4px; }
.day-top h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.375rem; }
.day-top p { margin: 4px 0 0; font-size: 0.875rem; color: var(--muted); }
.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 12px 12px 4px; }
.week-strip button { border: none; background: none; border-radius: 14px; padding: 6px 0 8px; cursor: pointer; display: grid; justify-items: center; gap: 3px; transition: background-color .2s; }
.week-strip button:hover { background: var(--sunk); }
.week-strip .dw { font-size: 0.75rem; color: var(--muted); }
.week-strip .dn { font-family: var(--f-mono); font-size: 1.0625rem; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; transition: background-color .25s, color .25s; }
.week-strip .on .dn { background: var(--ink); color: var(--surface); }
.week-strip .today .dn { color: var(--now); font-weight: 500; }
.week-strip .on.today .dn { background: var(--now); color: #fff; }
.week-strip .out { opacity: .3; pointer-events: none; }
.dots { display: flex; gap: 3px; height: 6px; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }
.dots i.x { background: var(--x); } .dots i.c { background: var(--claude); } .dots i.a { background: var(--admin); }
.dots i.ok { opacity: .3; }

.agenda { list-style: none; margin: 0; padding: 8px 12px 16px; }
.item { display: grid; grid-template-columns: 52px 18px minmax(0, 1fr); gap: 0 8px; }
.item .time { font-family: var(--f-mono); font-size: 0.9375rem; font-weight: 500; text-align: right; padding-top: 14px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.item .time small { display: block; font-size: 0.75rem; color: var(--faint); font-weight: 400; }
.item .rail { position: relative; }
.item .rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: var(--line); }
.item:first-child .rail::before { top: 20px; }
.item:last-child .rail::before { bottom: calc(100% - 20px); }
.item .rail i { position: absolute; left: 50%; top: 18px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); border: 2.5px solid var(--surface); box-shadow: 0 0 0 1.5px currentColor; background: currentColor; }
.item.x .rail i { color: var(--x); } .item.c .rail i { color: var(--claude); } .item.a .rail i { color: var(--admin); }
.item.ok .rail i { background: var(--surface); }
.box { margin: 6px 0; border-radius: 14px; background: var(--sunk); transition: background-color .25s; }
.item.x .box { background: var(--x-soft); } .item.c .box { background: var(--claude-soft); } .item.a .box { background: var(--admin-soft); }
.item.ok .box { background: var(--sunk); }
.tog { width: 100%; border: none; background: none; text-align: left; padding: 10px 14px 12px; cursor: pointer; display: grid; gap: 2px; }
.row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.8125rem; }
.tag { font-weight: 700; border-radius: 99px; padding: 0 9px; font-size: 0.75rem; line-height: 1.7; color: #fff; }
.tag.x { background: var(--x); } .tag.c { background: var(--claude); } .tag.a { background: var(--admin); }
:root .tag { color: var(--surface); }
.kind { color: var(--muted); }
.ck { color: var(--done); font-weight: 700; }
.chev { margin-left: auto; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform .35s var(--ease); }
.item.open .chev { transform: rotate(180deg); }
.ttl { font-size: 1rem; font-weight: 700; line-height: 1.5; }
.item.ok .ttl { color: var(--muted); }
.more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.item.open .more { grid-template-rows: 1fr; }
.more > div { overflow: hidden; min-height: 0; }
.more .in { padding: 0 14px 14px; }
.meta { font-size: 0.8125rem; color: var(--muted); margin: 0; }
.meta code { font-family: var(--f-mono); font-size: 0.8125rem; }
.steps { margin: 10px 0 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 6px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 0.9375rem; line-height: 1.6; }
.steps li::before { content: counter(s); width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.copy { margin-top: 12px; }
.copy-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.8125rem; color: var(--muted); }
.copy pre { margin: 6px 0 0; padding: 12px 14px; background: var(--surface); border-radius: 10px; font-family: var(--f-body); font-size: 0.9375rem; line-height: 1.8; white-space: pre-wrap; word-break: break-all; }
.cbtn { border: none; background: var(--ink); color: var(--surface); border-radius: 99px; padding: 4px 14px; font-size: 0.8125rem; cursor: pointer; transition: transform .15s var(--ease), background-color .2s; }
.cbtn:active { transform: scale(.94); }
.cbtn.ok { background: var(--done); }
.opts { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.opts li { font-size: 0.9375rem; padding: 6px 14px; background: var(--surface); border-radius: 99px; }
.done-btn { margin-top: 14px; width: 100%; border: 1.5px solid var(--done); background: var(--surface); color: var(--done); border-radius: 12px; padding: 10px; font-size: 0.9375rem; font-weight: 700; cursor: pointer; transition: background-color .25s, color .25s, transform .15s var(--ease); }
.done-btn:active { transform: scale(.98); }
.done-btn[aria-pressed="true"] { background: var(--done); color: var(--surface); }
.nowrow { display: grid; grid-template-columns: 52px 18px minmax(0, 1fr); gap: 0 8px; align-items: center; height: 24px; }
.nowrow span { font-family: var(--f-mono); font-size: 0.75rem; color: var(--now); text-align: right; font-weight: 500; }
.nowrow i { justify-self: center; width: 10px; height: 10px; border-radius: 50%; background: var(--now); box-shadow: 0 0 0 4px color-mix(in srgb, var(--now) 22%, transparent); }
.nowrow b { height: 2px; background: var(--now); border-radius: 2px; }
.gap { grid-column: 3; font-size: 0.75rem; color: var(--faint); padding: 2px 0 2px 4px; }
.empty { padding: 28px 20px; color: var(--muted); text-align: center; }

/* ---- 週（時間の表） ---- */
.tg-head { display: grid; grid-template-columns: 54px repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); padding-top: 8px; }
.tg-head button { border: none; background: none; padding: 2px 0 10px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
.tg-head .dw { font-size: 0.75rem; color: var(--muted); }
.tg-head .dn { font-family: var(--f-mono); font-size: 1.125rem; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; transition: background-color .2s; }
.tg-head button:hover .dn { background: var(--sunk); }
.tg-head .sel .dn { background: var(--ink); color: var(--surface); }
.tg-head .today .dn { background: var(--now); color: #fff; }
.tg-head .out { opacity: .3; pointer-events: none; }
.tg-body { height: min(calc(100vh - 260px), 860px); min-height: 440px; overflow-y: auto; overscroll-behavior: contain; position: relative; }
.tg-grid { display: grid; grid-template-columns: 54px repeat(7, minmax(0, 1fr)); position: relative; height: calc(var(--hour) * var(--span)); }
.hours { position: relative; }
.hours span { position: absolute; right: 10px; transform: translateY(-50%); font-family: var(--f-mono); font-size: 0.75rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% var(--hour); }
.col.today { background-color: color-mix(in srgb, var(--now) 4%, transparent); }
.col.out { background-color: var(--sunk); }
.ev { position: absolute; border: none; text-align: left; border-radius: 8px; padding: 5px 8px; cursor: pointer; overflow: hidden; line-height: 1.35; transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
.ev:hover { transform: translateY(-1px); box-shadow: var(--shadow); z-index: 3; }
.ev.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); z-index: 4; }
.ev.x { background: var(--x); color: #fff; } .ev.c { background: var(--claude); color: #fff; } .ev.a { background: var(--admin); color: #fff; }
:root .ev.x, :root .ev.c, :root .ev.a { color: var(--surface); }
.ev.ok { opacity: .45; }
.ev .tm { display: block; font-family: var(--f-mono); font-size: 0.75rem; opacity: .9; }
.ev .tt { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.8125rem; font-weight: 700; }
.nowline { position: absolute; left: -1px; right: 0; height: 2px; background: var(--now); z-index: 5; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }

/* 週（スマホ）：日ごとの一覧 */
.wk-list { list-style: none; margin: 0; padding: 8px 12px 14px; }
.wk-day { border-top: 1px solid var(--line); }
.wk-day:first-child { border-top: none; }
.wk-day > button { width: 100%; border: none; background: none; text-align: left; cursor: pointer; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; padding: 12px 6px; border-radius: 12px; transition: background-color .2s; }
.wk-day > button:hover { background: var(--sunk); }
.wk-date { text-align: center; line-height: 1.2; }
.wk-date small { display: block; font-size: 0.75rem; color: var(--muted); }
.wk-date b { font-family: var(--f-mono); font-weight: 500; font-size: 1.25rem; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; }
.wk-day.today .wk-date b { background: var(--now); color: #fff; }
.wk-rows { display: grid; gap: 4px; min-width: 0; }
.wk-row { display: grid; grid-template-columns: 44px 4px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 0.875rem; }
.wk-row .t { font-family: var(--f-mono); font-size: 0.8125rem; color: var(--muted); }
.wk-row .b { align-self: stretch; border-radius: 2px; }
.wk-row .b.x { background: var(--x); } .wk-row .b.c { background: var(--claude); } .wk-row .b.a { background: var(--admin); }
.wk-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-row.ok .n { color: var(--faint); text-decoration: line-through; }
.wk-day.out { opacity: .35; }

/* ---- 月 ---- */
.mo-dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 12px 12px 4px; font-size: 0.75rem; color: var(--muted); text-align: center; }
.mo { padding: 0 12px 14px; }
.mo-wk { font-size: 0.8125rem; color: var(--muted); padding: 12px 4px 6px; display: flex; gap: 10px; align-items: baseline; }
.mo-wk b { color: var(--claude); flex: none; }
.mo-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.mo-cell { min-width: 0; min-height: 112px; border: none; border-left: 1px solid var(--line); background: none; text-align: left; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: background-color .2s; }
.mo-cell:first-child { border-left: none; }
.mo-cell:hover { background: var(--sunk); }
.mo-cell.out { cursor: default; background: none; }
.mo-cell.out .mn { color: var(--faint); }
.mo-cell.past .mp { opacity: .55; }
.mn { font-family: var(--f-mono); font-size: 0.875rem; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; flex: none; transition: background-color .2s, color .2s; }
.mo-cell.on .mn { background: var(--ink); color: var(--surface); }
.mo-cell.today .mn { background: var(--now); color: #fff; }
.mp { display: block; font-size: 0.75rem; line-height: 1.5; border-radius: 5px; padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.mp.x { background: var(--x-soft); box-shadow: inset 3px 0 var(--x); } .mp.c { background: var(--claude-soft); box-shadow: inset 3px 0 var(--claude); } .mp.a { background: var(--admin-soft); box-shadow: inset 3px 0 var(--admin); }
.mp.ok { color: var(--faint); text-decoration: line-through; }
.mo-cell .dots { display: none; }
.mo-below { display: none; border-top: 1px solid var(--line); }
@media (max-width: 760px) {
  .mo-cell { min-height: 58px; align-items: center; padding: 6px 2px; }
  .mo-cell .mp { display: none; }
  .mo-cell .dots { display: flex; flex-wrap: wrap; height: auto; }
  .mo-below { display: block; }
}

/* ---- 右：その日の予定 ---- */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); max-height: calc(100vh - 40px); overflow-y: auto; overscroll-behavior: contain; }
@media (max-width: 1079px) { .side { display: none; } }
.foot { font-size: 0.8125rem; color: var(--muted); text-align: center; margin: 4px 0 0; }
.foot code { font-family: var(--f-mono); }
@media (max-width: 520px) {
  .brand h1 { font-size: 1.25rem; }
  .seg { width: 100%; }
  .label { font-size: 1.25rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>

<div class="app" id="app">
  <div class="main">
    <header class="head">
      <div class="brand">
        <h1>ムートン運用カレンダー</h1>
        <div class="goal" id="goal"></div>
      </div>
      <div class="controls">
        <h2 class="label" id="label"></h2>
        <div class="nav">
          <button type="button" class="pill" id="today">今日</button>
          <button type="button" class="icon" id="prev" aria-label="前へ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button type="button" class="icon" id="next" aria-label="次へ"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="seg" role="group" aria-label="表示">
          <span class="ind" id="ind"></span>
          <button type="button" data-view="day">日</button>
          <button type="button" data-view="week">週</button>
          <button type="button" data-view="month">月</button>
        </div>
      </div>
      <div class="legend">
        <span><i class="sw x"></i>X で投稿</span>
        <span><i class="sw c"></i>Claude に送る</span>
        <span><i class="sw a"></i>管理画面で数字を見る</span>
      </div>
    </header>
    <section class="card stage" id="stage" style="margin-top:16px"><div class="view" id="view"></div></section>
    <p class="foot" id="foot" style="margin-top:16px"></p>
  </div>
  <aside class="card side" id="side" aria-live="polite"></aside>

<script>
const DATA = {"generated":"2026-10-07","slots":[{"date":"2026-10-07","slot":"朝","id":"OL-1","kind":"選び方","article":"オリーブオイルの選び方","done":true,"memo":"本文リンク（旧型）","form":"本文リンク","formNote":"","angle":"","body":"「エキストラバージン」と書いてあるオリーブオイル。\n\n実は日本の規格（JAS）には、エキストラバージンという区分がない。\n\nじゃあ店で何を見ればいいのか。容器、日付、表示、量。研究をもとに5つに絞った。\n\nhttps://moutonarchive.com/olive-oil-guide.html?utm_source=x&utm_medium=social&utm_campaign=olive-oil-guide&utm_content=body","reply":"","followup":"","options":[],"slug":"olive-oil-guide"},{"date":"2026-10-07","slot":"夜","id":"R3","kind":"読み物","article":"コーヒーは、本当に体に悪いのか","done":true,"memo":"本文リンク（旧型）","form":"本文リンク","formNote":"","angle":"","body":"コーヒーは体に悪い？いい？\n\n200本以上のメタ解析をまとめた研究では、リスクが最も低かったのは1日3〜4杯あたり。\n\nただし見落としやすいのが睡眠。寝る6時間前のカフェインでも、眠りが短くなった実験がある。\n\nhttps://moutonarchive.com/coffee.html?utm_source=x&utm_medium=social&utm_campaign=coffee&utm_content=body","reply":"","followup":"","options":[],"slug":"coffee"},{"date":"2026-10-08","slot":"朝","id":"PT-5","kind":"選び方","article":"プロテインの選び方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"意外な数字：上限1.6g","body":"プロテイン、たくさん飲むほど筋肉は増える？\n\n49の試験をまとめた研究では、1日のたんぱく質が体重1kgあたり約1.6gを超えると、それ以上とっても筋肉はほとんど増えなかった。\n\n体重60kgなら、1日約100gが一つの上限の目安。まず食事でどれだけ取れているかから。","reply":"「プロテインの選び方」の記事はこちら → https://moutonarchive.com/protein-guide.html?utm_source=x&utm_medium=social&utm_campaign=protein-guide&utm_content=reply","followup":"","options":[],"slug":"protein-guide"},{"date":"2026-10-08","slot":"夜","id":"CF-V1","kind":"選び方","article":"コーヒーの選び方と淹れ方","done":false,"memo":"投票","form":"投票","formNote":"","angle":"投票：コレステロールが上がりやすい淹れ方","body":"クイズ。\n\nコーヒー豆には、LDLコレステロールを上げる油の成分が含まれている。研究で、コレステロールが上がる傾向が大きかった淹れ方はどれ？\n\n答えは明日の朝に。","reply":"","followup":"","options":["紙のフィルター（ドリップ）","鍋で煮出す","どちらも同じ"],"slug":""},{"date":"2026-10-09","slot":"朝","id":"CF-A1","kind":"選び方","article":"コーヒーの選び方と淹れ方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"前の晩の投票を引用して投稿","angle":"答え合わせ（CF-V1）","body":"昨日のクイズの答え。\n\n「鍋で煮出す」。試験をまとめた研究では、上がる傾向はフィルターを通さないコーヒーで大きく、紙のフィルターで淹れたものではほとんど見られなかった。\n\n紙のフィルターが、油の成分を受け止めると考えられている。","reply":"「コーヒーの選び方と淹れ方」の記事はこちら → https://moutonarchive.com/coffee-guide.html?utm_source=x&utm_medium=social&utm_campaign=coffee-guide&utm_content=reply","followup":"","options":[],"slug":"coffee-guide"},{"date":"2026-10-09","slot":"夜","id":"TR-3","kind":"選び方","article":"家庭用ミニトランポリンの選び方","done":false,"memo":"本文リンク","form":"本文リンク","formNote":"","angle":"○×：耐荷重は体重ぴったりでいい？（新記事の告知）","body":"ミニトランポリンの耐荷重、自分の体重ぴったりで大丈夫？\n\n答えは、ぎりぎりは避ける。跳んで着地するとき、マットには体重以上の力がかかるから。家族で使うなら、いちばん重い人に合わせる。\n\n「家庭用ミニトランポリンの選び方」を新しく書いた。\n\nhttps://moutonarchive.com/mini-trampoline-guide.html?utm_source=x&utm_medium=social&utm_campaign=mini-trampoline-guide&utm_content=body","reply":"","followup":"","options":[],"slug":"mini-trampoline-guide"},{"date":"2026-10-10","slot":"朝","id":"FI-1","kind":"読み物","article":"第一印象は0.1秒で決まる。そして、寝不足は顔に出る","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"○×：顔の印象は0.1秒で決まる？","body":"○×クイズ。\n\n人は、知らない人の顔を0.1秒見ただけで「信頼できそうか」を判断している。\n\n答えは○。0.1秒だけ顔を見せた実験でも、時間をかけて見たときの判断とよく一致していた。時間を延ばして変わったのは、おもに判断への自信だった。","reply":"「第一印象は0.1秒で決まる。そして、寝不足は顔に出る」の記事はこちら → https://moutonarchive.com/first-impression-sleep.html?utm_source=x&utm_medium=social&utm_campaign=first-impression-sleep&utm_content=reply","followup":"","options":[],"slug":"first-impression-sleep"},{"date":"2026-10-10","slot":"夜","id":"OL-V1","kind":"選び方","article":"オリーブオイルの選び方","done":false,"memo":"投票","form":"投票","formNote":"","angle":"投票：酸化をいちばん抑えた容器","body":"クイズ。\n\nオリーブオイルを光の下で10か月保存した研究。酸化をいちばん抑え、抗酸化成分をよく残した容器は？\n\n答えは明日の朝に。","reply":"","followup":"","options":["緑色の瓶","UVカットの瓶","光を通さない紙パック"],"slug":""},{"date":"2026-10-11","slot":"朝","id":"OL-A1","kind":"選び方","article":"オリーブオイルの選び方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"前の晩の投票を引用して投稿","angle":"答え合わせ（OL-V1）","body":"昨日のクイズの答え。\n\n「光を通さない紙パック」。緑色の瓶やUVカットの瓶より、酸化を抑えた。\n\n店では、缶、色の濃い瓶、箱入りを。照明の当たる棚の前列にある透明な瓶は、選ぶ前から不利かもしれない。","reply":"「オリーブオイルの選び方」の記事はこちら → https://moutonarchive.com/olive-oil-guide.html?utm_source=x&utm_medium=social&utm_campaign=olive-oil-guide&utm_content=reply","followup":"","options":[],"slug":"olive-oil-guide"},{"date":"2026-10-11","slot":"夜","id":"ES-5","kind":"選び方","article":"耳栓とアイマスクの選び方","done":false,"memo":"本文リンク","form":"本文リンク","formNote":"","angle":"クイズ：WHO の夜の騒音の目安（新記事の告知）","body":"夜の車の音。WHO（欧州）が睡眠を守るために勧める目安は、何デシベル未満？\n\n答えは、平均45デシベル未満（夜間の道路交通騒音）。窓を閉めても届くなら、耳栓という手がある。選ぶのは遮音の強さより、耳に合うか。\n\n「耳栓とアイマスクの選び方」を新しく書いた。\n\nhttps://moutonarchive.com/earplug-eyemask-guide.html?utm_source=x&utm_medium=social&utm_campaign=earplug-eyemask-guide&utm_content=body","reply":"","followup":"","options":[],"slug":"earplug-eyemask-guide"},{"date":"2026-10-12","slot":"朝","id":"CH-5","kind":"選び方","article":"ダークチョコの選び方","done":false,"memo":"本文リンク","form":"本文リンク","formNote":"","angle":"○×：ダークチョコは全部チョコレート？","body":"「ダークチョコ」と書いてあれば、全部チョコレート？\n\n答えは、パッケージの裏にある。「名称」の欄が「チョコレート」「準チョコレート」「チョコレート菓子」などに分かれている。\n\nカカオが目当てなら、まず名称が「チョコレート」のものを。\n\nhttps://moutonarchive.com/dark-chocolate-guide.html?utm_source=x&utm_medium=social&utm_campaign=dark-chocolate-guide&utm_content=body","reply":"","followup":"","options":[],"slug":"dark-chocolate-guide"},{"date":"2026-10-12","slot":"夜","id":"R6-2","kind":"読み物","article":"昼寝は、何分がいいのか","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"比較：昼寝は何分がいい？","body":"昼寝、何分がいちばん良かった？\n\n0・5・10・20・30分を比べた実験では、10分の昼寝で起きた直後から眠気が減り、作業の成績も良くなった。30分だと、起きた直後はかえって悪くなった。\n\n答えは10分。短く切り上げる。","reply":"「昼寝は、何分がいいのか」の記事はこちら → https://moutonarchive.com/nap.html?utm_source=x&utm_medium=social&utm_campaign=nap&utm_content=reply","followup":"","options":[],"slug":"nap"},{"date":"2026-10-13","slot":"朝","id":"CF-5","kind":"選び方","article":"コーヒーの選び方と淹れ方","done":false,"memo":"本文リンク","form":"本文リンク","formNote":"","angle":"意外な数字：死亡リスクが最も低かった杯数","body":"コーヒー、死亡リスクが最も低かったのは「1日何杯」の人？\n\nノルウェーで50万人あまりを平均20年追った研究では、フィルターで淹れたコーヒーを1日1〜4杯飲む人だった。\n\n観察研究なので、淹れ方だけが原因とは言えない。\n\nhttps://moutonarchive.com/coffee-guide.html?utm_source=x&utm_medium=social&utm_campaign=coffee-guide&utm_content=body","reply":"","followup":"","options":[],"slug":"coffee-guide"},{"date":"2026-10-13","slot":"夜","id":"OR-V1","kind":"選び方","article":"口臭ケアの道具の選び方","done":false,"memo":"投票","form":"投票","formNote":"","angle":"投票：舌の汚れ、何で落とす？","body":"クイズ。\n\n口臭のある大人を対象にした試験のレビュー。舌の汚れを落とすとき、口臭の原因物質をわずかに多く減らしたのはどっち？\n\n答えは明日の朝に。","reply":"","followup":"","options":["歯ブラシ","舌専用のクリーナー","差はなかった"],"slug":""},{"date":"2026-10-14","slot":"朝","id":"OR-A1","kind":"選び方","article":"口臭ケアの道具の選び方","done":false,"memo":"本文リンク","form":"本文リンク","formNote":"前の晩の投票を引用して投稿","angle":"答え合わせ（OR-V1）","body":"昨日のクイズの答え。\n\n「舌専用のクリーナー」。歯ブラシより、口臭の原因になる揮発性硫黄化合物をわずかに多く減らした（2つの試験、合わせて40人と少ない）。\n\n使い方は、奥に軽く当てて手前に引く。起床時の1回で十分。\n\nhttps://moutonarchive.com/oral-care-guide.html?utm_source=x&utm_medium=social&utm_campaign=oral-care-guide&utm_content=body","reply":"","followup":"","options":[],"slug":"oral-care-guide"},{"date":"2026-10-14","slot":"夜","id":"FI-2","kind":"読み物","article":"第一印象は0.1秒で決まる。そして、寝不足は顔に出る","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"意外な数字：31時間眠らなかった顔","body":"31時間眠らないと、顔は他人にどう見える？\n\n18〜31歳の23人を、ふつうに眠った翌日と31時間眠らなかったあとに撮影し、何も知らない65人に評価してもらった実験では、寝不足の顔は健康そうに見えにくく、魅力的に見えにくく、疲れて見えた。","reply":"「第一印象は0.1秒で決まる。そして、寝不足は顔に出る」の記事はこちら → https://moutonarchive.com/first-impression-sleep.html?utm_source=x&utm_medium=social&utm_campaign=first-impression-sleep&utm_content=reply","followup":"","options":[],"slug":"first-impression-sleep"},{"date":"2026-10-15","slot":"朝","id":"DE-5","kind":"選び方","article":"制汗剤とデオドラントの選び方","done":false,"memo":"本文リンク","form":"本文リンク","formNote":"","angle":"常識を確かめる：アルミニウムは危ない？","body":"「制汗剤のアルミニウムは危ない」は本当か。\n\n欧州の科学委員会（SCCS）は、決められた濃度までなら安全に使えると結論づけた。乳がんとの関係を調べたレビューは、結果が一致せず結論を出せなかった。\n\n「危険」と言える根拠はない。でも評価は完全には一致していない。\n\nhttps://moutonarchive.com/deodorant-guide.html?utm_source=x&utm_medium=social&utm_campaign=deodorant-guide&utm_content=body","reply":"","followup":"","options":[],"slug":"deodorant-guide"},{"date":"2026-10-15","slot":"夜","id":"BH-5","kind":"選び方","article":"習慣を変えたいときに読む本","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"○×：習慣は21日で身につく？","body":"「習慣は21日で身につく」。○か×か。\n\n研究では、習慣が自動化するまでの期間は18日から254日まで幅があった。人と行動によって大きく違う。\n\n答えは×。「21日」は目安にしないほうがいい。","reply":"「習慣を変えたいときに読む本」の記事はこちら → https://moutonarchive.com/books-habits.html?utm_source=x&utm_medium=social&utm_campaign=books-habits&utm_content=reply","followup":"","options":[],"slug":"books-habits"},{"date":"2026-10-16","slot":"朝","id":"OL-5","kind":"選び方","article":"オリーブオイルの選び方","done":false,"memo":"本文リンク","form":"本文リンク","formNote":"","angle":"常識を確かめる：大容量はお得？","body":"オリーブオイル、大容量のほうがお得？\n\n開けたあとは、空気に触れるたびに酸化が進む。割安でも、使い切るまでに時間がかかれば、そのぶん劣化した油を使うことになる。\n\nまずは250〜500mLくらいから試して、自分の使う速さを知る。\n\nhttps://moutonarchive.com/olive-oil-guide.html?utm_source=x&utm_medium=social&utm_campaign=olive-oil-guide&utm_content=body","reply":"","followup":"","options":[],"slug":"olive-oil-guide"},{"date":"2026-10-16","slot":"夜","id":"PT-V1","kind":"選び方","article":"プロテインの選び方","done":false,"memo":"投票","form":"投票","formNote":"","angle":"投票：プロテインで増える筋肉の差","body":"クイズ。\n\n6週間以上の筋トレに、たんぱく質の補給を足した49の試験。補給した人の除脂肪量（筋肉など）は、しなかった人より平均どれくらい多く増えた？\n\n答えは明日の朝に。","reply":"","followup":"","options":["約0.3kg","約1kg","約3kg"],"slug":""},{"date":"2026-10-17","slot":"朝","id":"PT-A1","kind":"選び方","article":"プロテインの選び方","done":false,"memo":"本文リンク","form":"本文リンク","formNote":"前の晩の投票を引用して投稿","angle":"答え合わせ（PT-V1）","body":"昨日のクイズの答え。\n\n約0.3kg。補給したほうが筋力も除脂肪量も増えたが、差は大きくなかった。最大挙上重量の差は約2.5kg。\n\nプロテインは筋トレの代わりではなく、少し後押しするもの。\n\nhttps://moutonarchive.com/protein-guide.html?utm_source=x&utm_medium=social&utm_campaign=protein-guide&utm_content=body","reply":"","followup":"","options":[],"slug":"protein-guide"},{"date":"2026-10-17","slot":"夜","id":"FI-V1","kind":"読み物","article":"第一印象は0.1秒で決まる。そして、寝不足は顔に出る","done":false,"memo":"投票（翌朝、投票へのリプライで答え合わせ FI-A1）","form":"投票","formNote":"","angle":"投票：寝不足の顔と「一緒に過ごしたい」","body":"クイズ。\n\n2晩続けて睡眠を4時間に減らした実験。寝不足のときの顔を見た人たちは、その人と「一緒に過ごしたい」と思いやすくなった？\n\n答えは明日の朝、このポストへの返信で。","reply":"","followup":"答え：「思いにくくなった」。\n\n2晩4時間睡眠のときの顔は、十分に眠ったときより魅力的・健康そうに見えにくく、眠そうに見えていた（写真を見て評価した、数十人規模の実験）。\n\n大事な人に会う前の晩は、まず眠る。\n\nhttps://moutonarchive.com/first-impression-sleep.html?utm_source=x&utm_medium=social&utm_campaign=first-impression-sleep&utm_content=reply","options":["思いやすくなった","思いにくくなった","変わらなかった"],"slug":""},{"date":"2026-10-18","slot":"朝","id":"TR-5","kind":"選び方","article":"家庭用ミニトランポリンの選び方","done":false,"memo":"本文リンク","form":"本文リンク","formNote":"","angle":"比較：ゴム式とバネ式、音が出にくいのは？","body":"集合住宅でミニトランポリン。ゴム式とバネ式、音が出にくいのは？\n\n答えはゴム（バンジー）式。金属のバネがきしむ音が出ない。下には防振・防音のマットを敷く。\n\nそれでも振動はゼロにならないので、使う時間帯には気を配る。\n\nhttps://moutonarchive.com/mini-trampoline-guide.html?utm_source=x&utm_medium=social&utm_campaign=mini-trampoline-guide&utm_content=body","reply":"","followup":"","options":[],"slug":"mini-trampoline-guide"},{"date":"2026-10-18","slot":"夜","id":"R1-2","kind":"読み物","article":"日曜の夜が憂うつなのは、なぜか","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"日曜の夜に：ブルーマンデーは大きくなかった","body":"いま、日曜の夜がつらい人へ。\n\n約34万人の気分を曜日ごとに調べた研究では、「ブルーマンデー」は思われているほど大きくなかった。\n\nつらさの中心は、月曜そのものではなく、月曜を待つ時間なのかもしれない。","reply":"「日曜の夜が憂うつなのは、なぜか」の記事はこちら → https://moutonarchive.com/sunday-blues.html?utm_source=x&utm_medium=social&utm_campaign=sunday-blues&utm_content=reply","followup":"","options":[],"slug":"sunday-blues"},{"date":"2026-10-19","slot":"朝","id":"OR-5","kind":"選び方","article":"口臭ケアの道具の選び方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"比較：フロスか歯間ブラシか","body":"フロスと歯間ブラシ、歯ぐきの炎症の研究で良い結果だったのは？\n\n35の研究（大人3,929人）をまとめたコクランレビューでは、歯間ブラシ。ただし確かさは低い。\n\nすき間が狭いならフロス、すき間があるなら合うサイズの歯間ブラシ。","reply":"「口臭ケアの道具の選び方」の記事はこちら → https://moutonarchive.com/oral-care-guide.html?utm_source=x&utm_medium=social&utm_campaign=oral-care-guide&utm_content=reply","followup":"","options":[],"slug":"oral-care-guide"},{"date":"2026-10-19","slot":"夜","id":"R14-2","kind":"読み物","article":"転職で、年収は上がるのか","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"意外な数字：転職で賃金が増えた人","body":"転職して賃金が増えた人は、何割？\n\n2024年に転職した人のうち、増えた人は40.5%、減った人は29.4%（厚生労働省の雇用動向調査）。\n\n上がる人は増えている。でも全員ではない。","reply":"「転職で、年収は上がるのか」の記事はこちら → https://moutonarchive.com/salary-change.html?utm_source=x&utm_medium=social&utm_campaign=salary-change&utm_content=reply","followup":"","options":[],"slug":"salary-change"},{"date":"2026-10-20","slot":"朝","id":"CF-6","kind":"選び方","article":"コーヒーの選び方と淹れ方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"常識の否定：甘い缶コーヒー","body":"「コーヒーは体に悪くないらしい」。それ、甘い缶コーヒーにも当てはまる？\n\n当てはまらない。コーヒーの研究の結果は、砂糖がたっぷり入った飲料にはそのまま当てはまらない。\n\n毎日飲むなら、原材料の最初に砂糖が来ていないかを見る。","reply":"「コーヒーの選び方と淹れ方」の記事はこちら → https://moutonarchive.com/coffee-guide.html?utm_source=x&utm_medium=social&utm_campaign=coffee-guide&utm_content=reply","followup":"","options":[],"slug":"coffee-guide"},{"date":"2026-10-20","slot":"夜","id":"CH-V1","kind":"選び方","article":"ダークチョコの選び方","done":false,"memo":"投票","form":"投票","formNote":"","angle":"投票：カカオ分に含まれるのは？","body":"クイズ。\n\nダークチョコの「カカオ分〇%」。この数字に含まれているのはどれ？\n\n答えは明日の朝に。","reply":"","followup":"","options":["カカオマス","ココアパウダー","ココアバター（脂肪）","ぜんぶ"],"slug":""},{"date":"2026-10-21","slot":"朝","id":"CH-A1","kind":"選び方","article":"ダークチョコの選び方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"前の晩の投票を引用して投稿","angle":"答え合わせ（CH-V1）","body":"昨日のクイズの答え。\n\n「ぜんぶ」。カカオ分は、カカオマス、ココアパウダー、ココアバターなど、カカオ由来の原料の合計。脂肪も入っている。\n\nだから研究で注目される成分（フラバノール）の量は、数字だけでは決まらなかった。","reply":"「ダークチョコの選び方」の記事はこちら → https://moutonarchive.com/dark-chocolate-guide.html?utm_source=x&utm_medium=social&utm_campaign=dark-chocolate-guide&utm_content=reply","followup":"","options":[],"slug":"dark-chocolate-guide"},{"date":"2026-10-21","slot":"夜","id":"R9-2","kind":"読み物","article":"ブルーライトカットの眼鏡は、目の疲れに効くのか","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"○×：ブルーライトカット眼鏡で目の疲れは減る？","body":"ブルーライトカットの眼鏡で、目の疲れは減る？\n\nランダム化比較試験をまとめたコクランレビューの結論は、短期的な利点はおそらくない。\n\nそれより試したいのは、もっと地味な「休憩」。","reply":"「ブルーライトカットの眼鏡は、目の疲れに効くのか」の記事はこちら → https://moutonarchive.com/blue-light.html?utm_source=x&utm_medium=social&utm_campaign=blue-light&utm_content=reply","followup":"","options":[],"slug":"blue-light"},{"date":"2026-10-22","slot":"朝","id":"PT-6","kind":"選び方","article":"プロテインの選び方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"意外な数字：推奨量65g・50g","body":"大人のたんぱく質、1日の推奨量はどのくらい？\n\n食事摂取基準（2025年版）では、18〜64歳で男性65g、女性50g。\n\n肉、魚、卵、大豆製品、乳製品をふだん食べていれば、食事で満たせることが多い。プロテインは足りない分だけ。","reply":"「プロテインの選び方」の記事はこちら → https://moutonarchive.com/protein-guide.html?utm_source=x&utm_medium=social&utm_campaign=protein-guide&utm_content=reply","followup":"","options":[],"slug":"protein-guide"},{"date":"2026-10-22","slot":"夜","id":"R10-2","kind":"読み物","article":"オリーブ油は、本当に体にいいのか","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"常識の否定：量より置き換え","body":"オリーブオイル、たくさんとるほど体にいい？\n\n米国の観察研究で注目されたのは、量より「置き換え」。マーガリン、バター、マヨネーズなど1日5gをオリーブオイルに置き換えると、心血管疾患のリスクが5〜7%低かった。","reply":"「オリーブ油は、本当に体にいいのか」の記事はこちら → https://moutonarchive.com/olive-oil.html?utm_source=x&utm_medium=social&utm_campaign=olive-oil&utm_content=reply","followup":"","options":[],"slug":"olive-oil"},{"date":"2026-10-23","slot":"朝","id":"OL-6","kind":"選び方","article":"オリーブオイルの選び方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"クイズ：賞味期限はいつから？","body":"オリーブオイルの賞味期限。いつから数えた日付か知ってる？\n\n多くは、びん詰めした日が基準。オリーブを搾った時期は分からない。\n\n鮮度を知りたいなら、収穫日や搾油日が書いてあるものを。","reply":"「オリーブオイルの選び方」の記事はこちら → https://moutonarchive.com/olive-oil-guide.html?utm_source=x&utm_medium=social&utm_campaign=olive-oil-guide&utm_content=reply","followup":"","options":[],"slug":"olive-oil-guide"},{"date":"2026-10-23","slot":"夜","id":"DE-V1","kind":"選び方","article":"制汗剤とデオドラントの選び方","done":false,"memo":"投票","form":"投票","formNote":"","angle":"投票：汗を抑えるのはどっち？","body":"クイズ。\n\n制汗剤とデオドラント。汗そのものを抑えるのが、おもな役割なのはどっち？\n\n答えは明日の朝に。","reply":"","followup":"","options":["制汗剤","デオドラント","どちらも同じ"],"slug":""},{"date":"2026-10-24","slot":"朝","id":"DE-A1","kind":"選び方","article":"制汗剤とデオドラントの選び方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"前の晩の投票を引用して投稿","angle":"答え合わせ（DE-V1）","body":"昨日のクイズの答え。\n\n「制汗剤」。デオドラントは、おもに菌の増えすぎや匂いを抑えるためのもの。実際には、両方の成分が入った製品も多い。\n\nどっちかは、パッケージの「有効成分」で分かる。","reply":"「制汗剤とデオドラントの選び方」の記事はこちら → https://moutonarchive.com/deodorant-guide.html?utm_source=x&utm_medium=social&utm_campaign=deodorant-guide&utm_content=reply","followup":"","options":[],"slug":"deodorant-guide"},{"date":"2026-10-24","slot":"夜","id":"R7-2","kind":"読み物","article":"SNSを見る時間は、減らしたほうがいいのか","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"クイズ：SNS を1日30分にしたら","body":"SNSを1日30分に制限したら、3週間でどうなった？\n\n孤独感と落ち込みが減った、という実験がある。Facebookを4週間止めた実験では、幸福感がわずかに上がった。\n\nやめなくていい。でも、見る時間は自分で決めたい。","reply":"「SNSを見る時間は、減らしたほうがいいのか」の記事はこちら → https://moutonarchive.com/social-media-time.html?utm_source=x&utm_medium=social&utm_campaign=social-media-time&utm_content=reply","followup":"","options":[],"slug":"social-media-time"},{"date":"2026-10-25","slot":"朝","id":"BC-5","kind":"選び方","article":"転職を考えはじめたときに読む本","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"常識の否定：逃げる理由だけだと","body":"【PR】転職したい理由が「今の会社が嫌だ」だけだと、次の会社でも同じことが起きやすい。\n\n『世界一やさしい「やりたいこと」の見つけ方』は、好きなこと・得意なこと・大事なことを分けて書き出す本。\n\n逃げる理由の先の「向かう理由」を探すのに使える。","reply":"「転職を考えはじめたときに読む本」の記事はこちら → https://moutonarchive.com/books-career.html?utm_source=x&utm_medium=social&utm_campaign=books-career&utm_content=reply","followup":"","options":[],"slug":"books-career"},{"date":"2026-10-25","slot":"夜","id":"BH-6","kind":"選び方","article":"習慣を変えたいときに読む本","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"○×：意志力は使うと減る？","body":"【PR】「意志力は使うと減る」。○か×か。\n\n『スタンフォードの自分を変える教室』でも紹介されたこの研究は、23の研究室での大規模な追試で、効果がほとんど確認されなかった。\n\n答えは「言い切れない」。そこは割り引いて読みたい。","reply":"「習慣を変えたいときに読む本」の記事はこちら → https://moutonarchive.com/books-habits.html?utm_source=x&utm_medium=social&utm_campaign=books-habits&utm_content=reply","followup":"","options":[],"slug":"books-habits"},{"date":"2026-10-26","slot":"朝","id":"OR-6","kind":"選び方","article":"口臭ケアの道具の選び方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"常識の否定：洗口液で発生源は消えない","body":"洗口液で、口臭の発生源は消える？\n\n消えない。洗口液は、においを一時的に抑えるのには役立つが、舌の汚れや歯周病という発生源を取り除くものではない。\n\n舌の清掃と歯間の清掃が先。洗口液は補助。","reply":"「口臭ケアの道具の選び方」の記事はこちら → https://moutonarchive.com/oral-care-guide.html?utm_source=x&utm_medium=social&utm_campaign=oral-care-guide&utm_content=reply","followup":"","options":[],"slug":"oral-care-guide"},{"date":"2026-10-26","slot":"夜","id":"R13-2","kind":"読み物","article":"匂いケアは「脇と足の裏」から","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"常識の否定：自分の匂いは分からない","body":"自分の体臭は、自分では分かりにくい。\n\n人の嗅覚には、同じ匂いを嗅ぎ続けると感じにくくなる「順応」がある。\n\nそれに脇の匂いは、汗そのものではなく、皮膚の菌が分解してできる。","reply":"「匂いケアは「脇と足の裏」から」の記事はこちら → https://moutonarchive.com/odor-care.html?utm_source=x&utm_medium=social&utm_campaign=odor-care&utm_content=reply","followup":"","options":[],"slug":"odor-care"},{"date":"2026-10-27","slot":"朝","id":"CH-6","kind":"選び方","article":"ダークチョコの選び方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"","angle":"意外な数字：アルカリ処理で35mg→4mg","body":"ココアの良い成分、加工でどれだけ変わる？\n\nココアパウダーの研究では、アルカリ処理をしていないものが平均で1gあたり約35mg。強く処理したものは約4mgだった。\n\n選ぶなら砂糖なしの「純ココア」。処理の有無も見たい。","reply":"「ダークチョコの選び方」の記事はこちら → https://moutonarchive.com/dark-chocolate-guide.html?utm_source=x&utm_medium=social&utm_campaign=dark-chocolate-guide&utm_content=reply","followup":"","options":[],"slug":"dark-chocolate-guide"},{"date":"2026-10-27","slot":"夜","id":"ES-V1","kind":"選び方","article":"耳栓とアイマスクの選び方","done":false,"memo":"投票","form":"投票","formNote":"","angle":"投票：照明をつけて眠った晩の心拍数","body":"クイズ。\n\n健康な若い成人が、暗い部屋と、天井の照明をつけた部屋で1晩ずつ眠った実験。照明をつけた晩、睡眠中の心拍数は？\n\n答えは明日の朝に。","reply":"","followup":"","options":["高かった","低かった","変わらなかった"],"slug":""},{"date":"2026-10-28","slot":"朝","id":"ES-A1","kind":"選び方","article":"耳栓とアイマスクの選び方","done":false,"memo":"リプリンク","form":"リプリンク","formNote":"前の晩の投票を引用して投稿","angle":"答え合わせ（ES-V1）","body":"昨日のクイズの答え。\n\n「高かった」。翌朝のイン   const first = quote ? "前の晩の投票を開き、「引用」で投稿を作る" : "X で新しい投稿を作る";
  if (s.form === "本文リンク") return [first, "本文をそのまま貼る（最後のリンクは消さない）", "リプライはしない"];
  return [first, "本文を貼って投稿する（リンクは入れない）", "すぐ自分の投稿に返信して、リプライの1行を貼る"];
}
function detail(d, e) {
  let h = "";
  const steps = (a) => `<ol class="steps">${a.map((t) => `<li>${esc(t)}</li>`).join("")}</ol>`;
  if (e.key === "wake") h += steps(["Claude に「今日の仕事」と送る", "昨日の2本を投稿したかを伝える", "今日の2本（そのまま貼れる本文）を受け取る"]);
  else if (e.followup) h += `<p class="meta">前の晩の投票 <code>${esc(e.post.id)}</code> への返信として投稿する</p>` + copyBlock("答え合わせ", e.post.followup, `${d}-fu`);
  else if (e.post) {
    const s = e.post, k = `${s.date}-${s.slot}`;
    h += `<p class="meta"><code>${esc(s.id)}</code>・${esc(s.kind)}${s.angle ? `・${esc(s.angle)}` : ""}</p>`;
    h += steps(stepsFor(s));
    if (/^【PR】/.test(s.body)) h += `<p class="meta" style="margin-top:8px">【PR】を消さずに投稿する</p>`;
    if (s.body) h += copyBlock("本文", s.body, k + "-b");
    if (s.options.length) h += `<div class="copy"><div class="copy-head"><span>投票の選択肢（期間は1日）</span></div><ul class="opts">${s.options.map((o) => `<li>${esc(o)}</li>`).join("")}</ul></div>`;
    if (s.reply && s.form === "リプリンク") h += copyBlock("返信に貼る1行", s.reply, k + "-r");
    if (s.done) return h + `<p class="meta ck" style="margin-top:12px">✓ 投稿済み（順番表に記録あり）</p>`;
  } else if (e.ev) h += steps(e.ev.steps);
  return h + `<button type="button" class="done-btn" data-done="${doneKey(d, e)}" aria-pressed="${!!e.done}">${e.done ? "✓ 済み" : "やったら押す"}</button>`;
}
function itemHtml(d, e) {
  const id = `${d}|${e.key}`;
  const open = openKeys.has(id);
  return `<li class="item ${PLACE[e.place]} ${e.done ? "ok" : ""} ${open ? "open" : ""}" data-id="${id}">
    <div class="time">${hm(e.start)}<small>${hm(e.end)}</small></div>
    <div class="rail"><i></i></div>
    <div class="box"><button type="button" class="tog" aria-expanded="${open}"><span class="row1"><span class="tag ${PLACE[e.place]}">${esc(e.place)}</span><span class="kind">${esc(e.kind)}</span>${e.done ? `<span class="ck">✓ 済み</span>` : ""}${CHEV}</span><span class="ttl">${esc(e.title)}</span></button>
    <div class="more"><div><div class="in">${detail(d, e)}</div></div></div></div></li>`;
}
function agendaHtml(d, withHeader) {
  const evs = eventsFor(d);
  const w = weekOf(d);
  let h = withHeader ? `<div class="day-top"><h2>${md(d)}${d === TODAY ? `<small style="font-family:var(--f-body);font-size:.875rem;color:var(--now);margin-left:8px">今日</small>` : ""}</h2>${w ? `<p>第${w.n}週：${esc(w.text)}</p>` : ""}</div>` : "";
  if (!evs.length) return h + `<p class="empty">この日は決まった予定がありません。</p>`;
  h += `<ol class="agenda">`;
  let nowPlaced = d !== TODAY;
  for (const e of evs) {
    if (!nowPlaced && NOW.min < e.start) { h += nowRow(); nowPlaced = true; }
    h += itemHtml(d, e);
  }
  if (!nowPlaced) h += nowRow();
  return h + `</ol>`;
}
const nowRow = () => `<li class="nowrow" id="nowrow"><span>${hm(NOW.min)}</span><i></i><b></b></li>`;
const dotsHtml = (d) => `<span class="dots">${eventsFor(d).filter((e) => e.key !== "wake").map((e) => `<i class="${PLACE[e.place]} ${e.done ? "ok" : ""}"></i>`).join("")}</span>`;

// ---------- 各表示 ----------
function dayView() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(mondayOf(cursor), i));
  return `<div class="week-strip">${days.map((d) => `<button type="button" data-day="${d}" class="${d === cursor ? "on" : ""} ${d === TODAY ? "today" : ""} ${inRange(d) ? "" : "out"}" aria-label="${md(d)}"><span class="dw">${dow(d)}</span><span class="dn">${dnum(d)}</span>${dotsHtml(d)}</button>`).join("")}</div>` + agendaHtml(cursor, true);
}

function weekView() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(mondayOf(cursor), i));
  if (narrow()) {
    return `<ol class="wk-list">${days.map((d) => {
      const evs = eventsFor(d).filter((e) => e.key !== "wake");
      return `<li class="wk-day ${d === TODAY ? "today" : ""} ${inRange(d) ? "" : "out"}"><button type="button" data-day="${d}" data-go="day" ${inRange(d) ? "" : "disabled"}><span class="wk-date"><small>${dow(d)}</small><b>${dnum(d)}</b></span><span class="wk-rows">${evs.length ? evs.map((e) => `<span class="wk-row ${e.done ? "ok" : ""}"><span class="t">${hm(e.start)}</span><span class="b ${PLACE[e.place]}"></span><span class="n">${esc(e.title)}</span></span>`).join("") : `<span class="wk-row"><span class="t"></span><span></span><span class="n" style="color:var(--faint)">予定なし</span></span>`}</span></button></li>`;
    }).join("")}</ol>`;
  }
  let h = `<div class="tg-head"><span></span>${days.map((d) => `<button type="button" data-day="${d}" class="${d === TODAY ? "today" : ""} ${d === cursor ? "sel" : ""} ${inRange(d) ? "" : "out"}" aria-label="${md(d)}"><span class="dw">${dow(d)}</span><span class="dn">${dnum(d)}</span></button>`).join("")}</div>`;
  h += `<div class="tg-body" id="scroller"><div class="tg-grid" style="--span:${END_H - START_H}"><div class="hours">`;
  for (let hr = START_H + 1; hr < END_H; hr++) h += `<span style="top:calc(var(--hour) * ${hr - START_H})">${hr}:00</span>`;
  h += `</div>`;
  for (const d of days) {
    h += `<div class="col ${d === TODAY ? "today" : ""} ${inRange(d) ? "" : "out"}">`;
    for (const e of eventsFor(d)) {
      const top = (e.start - START_H * 60) / 60, ht = (e.end - e.start) / 60, w = 100 / e.lanes;
      h += `<button type="button" class="ev ${PLACE[e.place]} ${e.done ? "ok" : ""}" data-day="${d}" data-key="${e.key}" style="top:calc(var(--hour) * ${top} + 1px);height:calc(var(--hour) * ${ht} - 3px);left:calc(${w * e.lane}% + 3px);width:calc(${w}% - 6px)" aria-label="${hm(e.start)} ${esc(e.place)} ${esc(e.title)}"><span class="tm">${hm(e.start)}${e.done ? " ✓" : ""}</span>${ht >= 0.9 ? `<span class="tt">${esc(e.title)}</span>` : ""}</button>`;
    }
    if (d === TODAY && NOW.min >= START_H * 60 && NOW.min < END_H * 60) h += `<div class="nowline" id="nowline" style="top:calc(var(--hour) * ${(NOW.min - START_H * 60) / 60})"></div>`;
    h += `</div>`;
  }
  return h + `</div></div>`;
}

function monthView() {
  const first = `2026-${String(monthOf).padStart(2, "0")}-01`;
  let d = mondayOf(first), lastW = null;
  let h = `<div class="mo-dow">${["月", "火", "水", "木", "金", "土", "日"].map((x) => `<span>${x}</span>`).join("")}</div><div class="mo">`;
  for (let row = 0; row < 6; row++, d = addDays(d, 7)) {
    if (row > 0 && mon(d) !== monthOf) break;
    if (!inRange(d) && !inRange(addDays(d, 6))) continue;
    const w = weekOf(addDays(d, 3));
    if (w && w !== lastW) { h += `<div class="mo-wk"><b>第${w.n}週</b><span>${esc(w.text)}</span></div>`; lastW = w; }
    h += `<div class="mo-row">`;
    for (let k = 0; k < 7; k++) {
      const c = addDays(d, k);
      const evs = eventsFor(c).filter((e) => e.key !== "wake");
      const cls = [inRange(c) ? "" : "out", c < TODAY ? "past" : "", c === TODAY ? "today" : "", c === cursor ? "on" : ""].join(" ");
      h += `<button type="button" class="mo-cell ${cls}" data-day="${c}" ${inRange(c) ? "" : "disabled"} aria-label="${md(c)}"><span class="mn">${dnum(c)}</span>${evs.slice(0, 3).map((e) => `<span class="mp ${PLACE[e.place]} ${e.done ? "ok" : ""}">${esc(e.kind === "投票" ? "投票：" + e.title : e.title)}</span>`).join("")}${dotsHtml(c)}</button>`;
    }
    h += `</div>`;
  }
  return h + `</div><div class="mo-below" id="mo-below">${narrow() ? agendaHtml(cursor, true) : ""}</div>`;
}

// ---------- 描画（必要な所だけ） ----------
function renderHead() {
  const L = $("label");
  if (view === "month") L.innerHTML = `2026年${monthOf}月`;
  else if (view === "week") { const m = mondayOf(cursor), e = addDays(m, 6); L.innerHTML = `${mon(m)}月${dnum(m)}日 – ${mon(e) !== mon(m) ? mon(e) + "月" : ""}${dnum(e)}日`; }
  else L.innerHTML = `${mon(cursor)}月${dnum(cursor)}日<small>${dow(cursor)}曜日</small>`;
  const [p, n] = view === "month" ? [monthOf > 10, monthOf < 11] : view === "week" ? [mondayOf(cursor) > RANGE.from, addDays(mondayOf(cursor), 6) < RANGE.to] : [cursor > RANGE.from, cursor < RANGE.to];
  $("prev").disabled = !p; $("next").disabled = !n;
  document.querySelectorAll(".seg button").forEach((b, i) => {
    b.setAttribute("aria-pressed", b.dataset.view === view);
    if (b.dataset.view === view) $("ind").style.transform = `translateX(${i * 100}%)`;
  });
  const posted = DATA.slots.filter(isPosted).length, total = DATA.slots.length;
  const left = Math.max(0, Math.round((parse("2026-10-31") - parse(TODAY)) / 864e5));
  $("goal").innerHTML = `<span>投稿 <b>${posted}</b>/${total}</span><span class="meter"><span style="transform:scaleX(${posted / total})"></span></span><span>10/31 まで <b>${left}</b>日</span>`;
  $("app").classList.toggle("solo", view === "day");
  try { history.replaceState(null, "", "#d" + cursor); } catch {}
}
function renderView() {
  $("view").innerHTML = view === "day" ? dayView() : view === "week" ? weekView() : monthView();
  const sc = $("scroller");
  if (sc) {
    const first = mondayOf(cursor) <= TODAY && TODAY <= addDays(mondayOf(cursor), 6) ? NOW.min - 120 : START_H * 60;
    sc.scrollTop = Math.max(0, ((first - START_H * 60) / 60) * (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour")) || 50));
  }
}
function renderSide() {
  if (view === "day") { $("side").innerHTML = ""; return; }
  $("side").innerHTML = agendaHtml(cursor, true);
}
function renderAll() { renderHead(); renderView(); renderSide(); }

// 小さな更新：選んだ日の印だけ付け替える
function markSelected() {
  document.querySelectorAll(".tg-head button, .mo-cell, .week-strip button").forEach((b) => {
    const on = b.dataset.day === cursor;
    b.classList.toggle(b.classList.contains("mo-cell") || b.closest(".week-strip") ? "on" : "sel", on);
  });
}

// 画面の差し替え：横に少しずらしながらフェード（transform と opacity だけ）
let animating = null;
function swap(dir, fn) {
  const v = $("view");
  fn();
  if (REDUCED || !dir || !v.animate) { renderAll(); return; }
  animating?.cancel();
  const dx = dir === "next" ? 28 : -28;
  renderAll();
  animating = v.animate([{ transform: `translateX(${dx}px)`, opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 320, easing: "cubic-bezier(.22,.9,.25,1)" });
}

function selectDay(d, openKey) {
  if (!inRange(d)) return;
  const changed = d !== cursor;
  const dir = d > cursor ? "next" : "prev";
  cursor = d; monthOf = mon(d);
  if (changed) autoOpen(d);
  if (openKey) { openKeys.clear(); openKeys.add(`${d}|${openKey}`); }
  if (view === "day") return swap(changed ? dir : null, () => {});
  markSelected();
  renderHead();
  if (view === "month" && narrow()) $("mo-below").innerHTML = agendaHtml(cursor, true);
  renderSide();
  if (openKey) requestAnimationFrame(() => document.querySelector(`#side [data-id="${d}|${openKey}"]`)?.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" }));
}

function step(n) {
  swap(n > 0 ? "next" : "prev", () => {
    if (view === "month") { monthOf = Math.min(11, Math.max(10, monthOf + n)); cursor = clamp(`2026-${monthOf}-01`); }
    else cursor = clamp(addDays(cursor, n * (view === "week" ? 7 : 1)));
    autoOpen(cursor);
  });
}

// ---------- 操作 ----------
document.querySelector(".seg").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-view]");
  if (!b || b.dataset.view === view) return;
  const order = ["day", "week", "month"];
  const dir = order.indexOf(b.dataset.view) > order.indexOf(view) ? "next" : "prev";
  swap(dir, () => { view = b.dataset.view; monthOf = mon(cursor); store.set("view", view); });
});
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("today").addEventListener("click", () => { const t = clamp(TODAY); const dir = t > cursor ? "next" : t < cursor ? "prev" : null; swap(dir, () => { cursor = t; monthOf = mon(t); autoOpen(t); }); });

document.addEventListener("click", (ev) => {
  const t = ev.target;
  const c = t.closest("[data-copy]");
  if (c) return copy(c);
  const dn = t.closest("[data-done]");
  if (dn) {
    const on = dn.getAttribute("aria-pressed") !== "true";
    store.set(dn.dataset.done, on ? "1" : null);
    const li = dn.closest(".item");
    li.classList.toggle("ok", on);
    dn.setAttribute("aria-pressed", on);
    dn.textContent = on ? "✓ 済み" : "やったら押す";
    const row = li.querySelector(".row1");
    row.querySelector(".ck")?.remove();
    if (on) row.querySelector(".chev").insertAdjacentHTML("beforebegin", `<span class="ck">✓ 済み</span>`);
    renderHead();
    return;
  }
  const tog = t.closest(".tog");
  if (tog) {
    const li = tog.closest(".item"), id = li.dataset.id;
    const open = !li.classList.contains("open");
    li.classList.toggle("open", open);
    tog.setAttribute("aria-expanded", open);
    open ? openKeys.add(id) : openKeys.delete(id);
    return;
  }
  const b = t.closest("[data-day]");
  if (!b || b.disabled) return;
  if (b.dataset.go === "day") { const d = b.dataset.day; swap("next", () => { view = "day"; cursor = d; monthOf = mon(d); autoOpen(d); store.set("view", view); }); return; }
  if (b.classList.contains("ev")) {
    document.querySelectorAll(".ev.sel").forEach((x) => x.classList.remove("sel"));
    b.classList.add("sel");
    if (!wide()) { const d = b.dataset.day, k = b.dataset.key; swap("next", () => { view = "day"; cursor = d; monthOf = mon(d); openKeys.clear(); openKeys.add(`${d}|${k}`); }); return; }
  }
  selectDay(b.dataset.day, b.dataset.key || null);
});

function copy(btn) {
  const key = btn.dataset.copy;
  const ok = () => { btn.textContent = "コピーしました"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = "コピー"; btn.classList.remove("ok"); }, 1600); };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents($("pre-" + key));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = "選択しました";
  };
  try { navigator.clipboard.writeText(copyTexts[key]).then(ok, fallback); } catch { fallback(); }
}

// スワイプ：指に合わせて動かし、離したら前後へ
(() => {
  const v = $("view"), stage = $("stage");
  let x0 = null, y0 = 0, dx = 0, locked = null;
  stage.addEventListener("touchstart", (e) => { if (e.target.closest(".tg-body pre")) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; locked = null; animating?.cancel(); }, { passive: true });
  stage.addEventListener("touchmove", (e) => {
    if (x0 == null) return;
    dx = e.touches[0].clientX - x0;
    const dy = e.touches[0].clientY - y0;
    if (locked == null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) locked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (locked !== "x") return;
    const blocked = $(dx < 0 ? "next" : "prev").disabled;
    const x = blocked ? dx / 4 : dx;
    v.style.transform = `translateX(${x}px)`;
    v.style.opacity = String(1 - Math.min(Math.abs(x) / 600, 0.35));
  }, { passive: true });
  stage.addEventListener("touchend", () => {
    if (x0 == null) return;
    x0 = null;
    const was = locked; locked = null;
    if (was !== "x") return;
    const go = Math.abs(dx) > 70 && !$(dx < 0 ? "next" : "prev").disabled;
    const from = v.style.transform;
    v.style.transform = ""; v.style.opacity = "";
    if (go) step(dx < 0 ? 1 : -1);
    else if (v.animate && !REDUCED) v.animate([{ transform: from }, { transform: "none" }], { duration: 260, easing: "cubic-bezier(.22,.9,.25,1)" });
  }, { passive: true });
})();

// 今の時刻を動かす
setInterval(() => {
  const n = nowJST();
  if (n.min === NOW.min) return;
  NOW = n;
  const line = $("nowline");
  if (line) line.style.top = `calc(var(--hour) * ${(n.min - START_H * 60) / 60})`;
  document.querySelectorAll("#nowrow span").forEach((s) => (s.textContent = hm(n.min)));
}, 20000);

let lastNarrow = narrow(), lastWide = wide();
addEventListener("resize", () => {
  if (narrow() !== lastNarrow || wide() !== lastWide) { lastNarrow = narrow(); lastWide = wide(); renderAll(); }
});

renderAll();
$("foot").innerHTML = `投稿文と順番表は <code>promo/x-posts.md</code> から作っています（${esc(DATA.generated)} 時点）。時刻は目安。「済み」はこの端末にだけ記録されるので、投稿したら Claude にも伝えてください。`;
</script>
