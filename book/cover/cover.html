<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/300.css">
<link rel="stylesheet" href="./node_modules/@fontsource/noto-serif-jp/500.css">
<!-- サイトのOG画像（scripts/og/card.html）と同じ色と書体。 -->
<style>
  html,body{margin:0;width:1600px;height:2560px;overflow:hidden}
  body{background:#f8f5ee;color:#1b1c19;font-family:"Noto Serif JP",serif;position:relative}
  .band{position:absolute;inset:0 0 auto 0;height:36px;background:linear-gradient(90deg,#0b2f97,#1442c4 60%,#4f86e0)}
  .sun{position:absolute;right:-300px;top:-260px;width:1400px;height:1400px;border-radius:50%;
       background:radial-gradient(circle,rgba(242,214,150,.85) 0 18%,rgba(242,214,150,.25) 38%,transparent 62%)}
  .wrap{position:absolute;inset:260px 170px 200px 170px;display:flex;flex-direction:column}
  .label{font-family:Georgia,serif;font-style:italic;font-size:64px;color:#1442c4;letter-spacing:.02em}
  h1{margin:420px 0 0;font-weight:500;font-size:170px;line-height:1.4;letter-spacing:.04em}
  .sub{margin-top:110px;font-weight:300;font-size:62px;line-height:1.8;letter-spacing:.06em;color:#3b3d38}
  .rule{width:160px;height:3px;background:#1442c4;margin-top:110px}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:76px;letter-spacing:.3em;font-weight:300}
  .foot small{font-family:Georgia,serif;font-style:italic;letter-spacing:.04em;font-size:52px;color:#5b5d56}
</style></head>
<body><div class="band"></div><div class="sun"></div>
<div class="wrap">
  <div class="label">Philosophy</div>
  <h1>基準を、<br>自分の中に<br>置く</h1>
  <div class="rule"></div>
  <div class="sub">影響され、比べ、怖がりながら<br>生きるための17章</div>
  <div class="foot"><span>ムートン</span><small>essays</small></div>
</div>
</body></html>
