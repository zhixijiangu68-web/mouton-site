name: Verify restored MOUTON opening
on:
  push:
    branches: [fix/home-intro-on-open-20261013]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/home-intro-on-open-20261013
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild and run all checks
        run: |
          npm ci
          npm run build
          npm test
      - name: Verify repeated opening, shortcuts and tabs in browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {resolve} from 'node:path';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const url='file://'+resolve('index.html');
          for(const width of [390,1280]){
            const page=await browser.newPage({viewport:{width,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(url,{waitUntil:'load'});
            const first=await page.evaluate(()=>({
              intro:document.documentElement.classList.contains('intro'),
              visible:getComputedStyle(document.querySelector('.intro-veil')).display!=='none',
              word:document.querySelector('.intro-word')?.textContent?.trim(),
              panels:[...document.querySelectorAll('[data-home-panel]')].filter(p=>!p.hidden).map(p=>p.dataset.homePanel),
              pageWidth:document.documentElement.scrollWidth,
              viewport:innerWidth
            }));
            console.log('FIRST',width,JSON.stringify(first));
            if(!first.intro||!first.visible||first.word!=='MOUTON'||first.panels.join()!=='reading'||first.pageWidth>first.viewport+1)throw Error('Opening not visible '+width);
            // Prior sessions no longer suppress opening; same page in a browser tab.
            await page.keyboard.press('Escape');
            await page.reload({waitUntil:'load'});
            const next=await page.evaluate(()=>({
              intro:document.documentElement.classList.contains('intro'),
              visible:getComputedStyle(document.querySelector('.intro-veil')).display!=='none',
              tabs:document.querySelectorAll('[role=tab]').length
            }));
            console.log('REOPEN',width,JSON.stringify(next));
            if(!next.intro||!next.visible||next.tabs!==4)throw Error('Intro absent on reopened page '+width);
            await page.waitForTimeout(2750);
            const gone=await page.evaluate(()=>getComputedStyle(document.querySelector('.intro-veil')).display==='none');
            if(!gone)throw Error('Intro does not dismiss automatically');
            await page.locator('#home-tab-quiz').click();
            if(await page.locator('#home-tab-quiz').getAttribute('aria-selected')!=='true')throw Error('Tab switch broken');
            await page.goto(url+'#journal',{waitUntil:'load'});
            await page.reload({waitUntil:'load'}); // Direct bookmarked entry, not same-document fragment navigation
            const hash=await page.evaluate(()=>({intro:document.documentElement.classList.contains('intro'),journal:document.querySelector('#home-tab-journal')?.getAttribute('aria-selected')}));
            console.log('DEEP LINK',width,JSON.stringify(hash));
            if(hash.intro||hash.journal!=='true')throw Error('Deep-link obstructed');
            await page.goto(url+'#top',{waitUntil:'load'});
            await page.reload({waitUntil:'load'}); // Clicking the logo from another page performs a fresh navigation
            if(!(await page.evaluate(()=>document.documentElement.classList.contains('intro'))))throw Error('Logo homepage entry skips opening');
            if(errors.length)throw Error('Unexpected browser errors '+errors.join(';'));
            await page.close();
          }
          const page=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
          await page.goto(url,{waitUntil:'load'});
          const reduced=await page.evaluate(()=>({intro:document.documentElement.classList.contains('intro'),tabs:document.querySelectorAll('[role=tab]').length}));
          console.log('REDUCED',JSON.stringify(reduced));
          if(reduced.intro||reduced.tabs!==4)throw Error('Reduced-motion preference ignored');
          await page.close();
          await browser.close();
          JS
      - name: Remove one-off verification and commit generated homepage
        run: |
          rm .github/workflows/mouton-opening-20261013.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate homepage with reliable MOUTON opening animation"
            git push origin HEAD:fix/home-intro-on-open-20261013
          fi
          test -z "$(git status --porcelain)"
