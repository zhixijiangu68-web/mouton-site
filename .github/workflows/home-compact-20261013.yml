name: Compact homepage responsive verification
on:
  push:
    branches: [shorten-home-remove-cursor-20261013]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: shorten-home-remove-cursor-20261013
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild and run regression suite
        run: |
          node --check home.js
          npm ci
          npm run build
          npm test
      - name: Browser tests on compact page and baseline
        run: |
          git show origin/main:index.html > baseline-pr-index.html
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import {resolve} from 'node:path';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          for(const width of [390,768,1280]){
            const page=await browser.newPage({viewport:{width,height:844},reducedMotion:'reduce'});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const go=path=>page.goto('file://'+resolve(path),{waitUntil:'load'});
            await go('baseline-pr-index.html');
            const oldHeight=await page.evaluate(()=>document.documentElement.scrollHeight);
            await go('index.html');
            const before=await page.evaluate(()=>({
              width:innerWidth,
              pageWidth:document.documentElement.scrollWidth,
              height:document.documentElement.scrollHeight,
              headings:[...document.querySelectorAll('h1')].map(x=>x.textContent),
              scenes:document.querySelectorAll('main [data-scene]').length,
              customCursor:document.querySelectorAll('.cursor-dot').length,
              topics:[...document.querySelectorAll('.home-topic-card')].length,
              featured:document.querySelectorAll('.reading3-card').length,
              guides:document.querySelectorAll('#guides .guide-card').length,
              journal:document.querySelectorAll('#journal .journal-item:not(.is-collapsed):not(.is-hidden)').length,
              quiz:!!document.querySelector('[data-qloop]'),
              anchors:['think','body','food','foodscience','books','projects','about','journal','reading','today-q','guides'].filter(x=>!document.getElementById(x))
            }));
            console.log('RESULT',width,JSON.stringify({oldHeight,...before,ratio:Number((before.height/oldHeight).toFixed(3)),errors}));
            if(errors.length||before.pageWidth>width+1||before.headings.length!==1||before.scenes>0||before.customCursor||before.topics!==3||before.featured!==2||before.guides!==3||!before.quiz||before.anchors.length)throw Error('Home regression '+width);
            if(before.height>=oldHeight*.6)throw Error('Homepage not sufficiently shorter '+width+' ratio '+(before.height/oldHeight));
            await page.locator('[data-cover-toggle]').click();
            if(await page.evaluate(()=>document.documentElement.dataset.cover)!=='day')throw Error('Day/night toggle broken');
            await page.locator('[data-journal-filter="body"]').click();
            if(await page.locator('#journal .journal-item:not(.is-hidden)').count()<1)throw Error('Journal category broken');
            await page.locator('[data-journal-filter="all"]').click();
            await page.locator('.journal-more').click();
            if(await page.locator('#journal .journal-item.is-collapsed').count()!==0)throw Error('Journal expand broken');
            if(width===390){
              await page.locator('.menu-toggle').click();
              if(await page.locator('.menu-toggle').getAttribute('aria-expanded')!=='true')throw Error('Mobile menu broken');
            }
            await page.close();
          }
          await browser.close();
          JS
      - name: Commit regenerated site without temporary workflow
        run: |
          rm -f baseline-pr-index.html .github/workflows/home-compact-20261013.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild compact homepage and verify responsive behavior"
            git push origin HEAD:shorten-home-remove-cursor-20261013
          fi
          test -z "$(git status --porcelain)"
