name: Build check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests, Eleventy build and generated-site validation
        run: npm test
      - name: Generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::生成されたファイルが src/ と一致していません。npm run build を実行してからコミットしてください。"
            exit 1
          fi
