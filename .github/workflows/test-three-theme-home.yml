name: Verify three-theme homepage
on:
  push:
    branches: [feature/home-three-topic-entrance-20261013]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/home-three-topic-entrance-20261013
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Eleventy build and regressions
        run: |
          npm ci
          npm run build
          npm test
          node --check home-tabs.js
          node --check home.js
      - name: Test three big cards, actual breakpoints and preserved opening
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {resolve,join} from 'node:path';
          import {existsSync} from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const file='file://'+resolve('index.html');
          const expectUrls=['topic-philosophy.html','topic-body.html','topic-food.html'];
          for(const [width,height] of [[390,650],[390,844],[768,700],[1280,800],[1600,900]]){
            const page=await browser.newPage({viewport:{width,height},reducedMotion:'reduce'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(file,{waitUntil:'load'});
            const measure=await page.evaluate(()=>{
              const rect=x=>{const r=x.getBoundingClientRect();return {x:Math.round(r.x),top:Math.round(r.top),right:Math.round(r.right),bottom:Math.round(r.bottom),height:Math.round(r.height)}};
              return {
                title:document.querySelector('h1')?.textContent?.trim(),
                cards:[...document.querySelectorAll('.cover-choice-card')].map(x=>({text:x.textContent.replace(/\\s+/g,' ').trim(),href:x.getAttribute('href'),rect:rect(x),background:getComputedStyle(x.querySelector('.cover-choice-art')).backgroundImage})),
                tabs:document.querySelectorAll('[role="tab"]').length,
                visiblePanel:[...document.querySelectorAll('[data-home-panel]')].filter(x=>!x.hidden).map(x=>x.dataset.homePanel),
                cardNav:!!document.querySelector('.cover-choice-grid[aria-label]'),
                tabRect:rect(document.querySelector('.home-tab-list')),
                cover:rect(document.querySelector('.cover')),
                ticker:rect(document.querySelector('.hero-ticker')),
                coverMode:rect(document.querySelector('[data-cover-toggle]')),
                viewport:{width:innerWidth,height:innerHeight},scrollWidth:document.documentElement.scrollWidth,
                duplicates:['think','body','food','foodscience'].filter(id=>document.querySelectorAll('#'+id).length!==1),
                imageFallbacks:[...document.querySelectorAll('.cover-choice-card')].map(x=>getComputedStyle(x).backgroundColor)
              };
            });
            console.log('LAYOUT',width,height,JSON.stringify(measure));
            if(errors.length)throw Error('Page JS errors '+errors.join(';'));
            if(measure.title!=='今日は、何が気になる？'||measure.cards.length!==3||measure.cards.some((x,i)=>x.href!==expectUrls[i]||!x.background.includes('/images/placeholder/'))||!measure.cardNav)throw Error('Incomplete featured topic cards '+width);
            if(measure.tabs!==4||measure.visiblePanel.join()!=='reading'||measure.duplicates.length||measure.scrollWidth>width+1)throw Error('Old navigation or responsive layout broken '+width);
            if(measure.cards.some(x=>x.rect.right>width+1||x.rect.x<0||x.rect.height<100))throw Error('Theme cards cut off '+width);
            if(width>=768&&measure.cards.some(x=>x.rect.bottom>height+10))throw Error('Choices not visible on desktop/tablet '+width);
            if(width===390&&height===844&&measure.cards[2].rect.bottom>height+10)throw Error('Last theme hidden on standard mobile');
            if(width>=768&&measure.cards[0].rect.top!==measure.cards[1].rect.top)throw Error('Cards not in a row '+width);
            if(width===390&&measure.cards[0].rect.top>=measure.cards[1].rect.top)throw Error('Mobile card stack broken');
            for(const href of expectUrls)if(!existsSync(join(process.cwd(),href)))throw Error('Theme target missing '+href);
            await page.locator('.cover-choice-card--body').click();
            if(!page.url().endsWith('/topic-body.html'))throw Error('Body navigation broken');
            await page.goto(file,{waitUntil:'load'});
            await page.locator('#home-tab-topics').click();
            if(await page.locator('#guides .guide-card:visible').count()!==3)throw Error('Guides unavailable');
            if(await page.locator('#home-tab-topics').textContent()!=='選び方')throw Error('Duplicate theme tab not renamed');
            await page.locator('#home-tab-quiz').click();
            if(await page.locator('#today-q [data-qloop]').count()!==1)throw Error('Quiz removed');
            await page.locator('#home-tab-journal').click();
            if(await page.locator('#journal-search-input').count()!==1)throw Error('Journal search removed');
            await page.close();
          }
          // Normal-motion visitors still see the original long cinematic opening.
          const page=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'no-preference'});
          await page.goto(file,{waitUntil:'load'});
          const intro=await page.evaluate(()=>({show:document.documentElement.classList.contains('intro'),animation:getComputedStyle(document.querySelector('.intro-veil')).animationName,word:document.querySelector('.intro-word')?.textContent.trim()}));
          console.log('INTRO',JSON.stringify(intro));
          if(!intro.show||intro.animation!=='veil-dissolve'||intro.word!=='MOUTON')throw Error('Cinematic intro was changed');
          await page.locator('.intro-veil').click();
          await page.locator('.cover-choice-card--food').click();
          if(!page.url().endsWith('/topic-food.html'))throw Error('Site unusable after opening');
          await page.close();
          await browser.close();
          JS
      - name: Remove temporary workflow and sync generated HTML
        run: |
          rm -f .github/workflows/test-three-theme-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Generate and verify the three-theme MOUTON homepage"
            git push origin HEAD:feature/home-three-topic-entrance-20261013
          fi
          test -z "$(git status --porcelain)"
