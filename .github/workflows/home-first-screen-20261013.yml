name: Validate visible first-screen home tabs
on:
  push:
    branches: [fix/visible-home-tabs-first-screen-20261013]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/visible-home-tabs-first-screen-20261013
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test
      - name: Actual viewport validation
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { resolve } from 'node:path';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          for (const [width,height] of [[390,650],[390,844],[768,700],[1280,800]]) {
            const page=await b.newPage({viewport:{width,height},reducedMotion:'reduce'});
            let errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('file://'+resolve('index.html'),{waitUntil:'load'});
            const state=await page.evaluate(()=>{
              const rect=s=>{const x=document.querySelector(s)?.getBoundingClientRect();return x&&{top:Math.round(x.top),bottom:Math.round(x.bottom),left:Math.round(x.left),right:Math.round(x.right),height:Math.round(x.height)}};
              return {viewport:innerHeight,scrollWidth:document.documentElement.scrollWidth,cover:rect('.cover'),tabs:rect('.home-tab-list'),ticker:rect('.hero-ticker'),toggle:rect('[data-cover-toggle]'),actions:rect('.cover-actions'),intro:document.querySelector('.intro-veil')!==null,panels:[...document.querySelectorAll('[data-home-panel]')].filter(p=>!p.hidden).map(p=>p.dataset.homePanel)};
            });
            console.log('MEASURE',width,height,JSON.stringify(state));
            if(errors.length||state.scrollWidth>width+1||state.panels.join()!=='reading'||!state.intro)throw Error('Regression '+width+' '+height);
            if(state.tabs.top>height-50||state.tabs.bottom>height+1)throw Error('Tabs still not visible in initial viewport '+width+' '+height);
            const overlap=(a,b)=>a&&b&&a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
            const placements=await page.evaluate(()=>{
              const box=s=>{const v=document.querySelector(s)?.getBoundingClientRect();return v&&{left:v.left,right:v.right,top:v.top,bottom:v.bottom};};
              return {toggle:box('[data-cover-toggle]'),kicker:box('.cover-kicker'),title:box('.cover-title'),actions:box('.cover-actions'),links:box('.cover-links')};
            });
            if(['kicker','title','actions','links'].some(x=>overlap(placements.toggle,placements[x])))throw Error('Day/Night overlays hero content: '+width+' '+height+' '+JSON.stringify(placements));
            await page.locator('#home-tab-journal').click();
            if(await page.locator('#home-tab-journal').getAttribute('aria-selected')!=='true')throw Error('Tab broken');
            await page.locator('[data-cover-toggle]').click();
            if(await page.evaluate(()=>document.documentElement.dataset.cover)!=='day')throw Error('Day/night broken');
            await page.close();
          }
          const page=await b.newPage({viewport:{width:390,height:844}});
          await page.goto('file://'+resolve('index.html'),{waitUntil:'load'});
          const opening=await page.evaluate(()=>({active:document.documentElement.classList.contains('intro'),visible:getComputedStyle(document.querySelector('.intro-veil')).display==='grid'}));
          console.log('OPENING',JSON.stringify(opening));
          if(!opening.active||!opening.visible)throw Error('Cinematic opening missing');
          await b.close();
          JS
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/home-first-screen-20261013.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Verify home tabs visible immediately on mobile and desktop"
            git push origin HEAD:fix/visible-home-tabs-first-screen-20261013
          fi
