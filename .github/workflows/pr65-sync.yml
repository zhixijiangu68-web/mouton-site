name: PR65 synchronize source onto latest main
on:
  push:
    branches: [claude/home-first-impression]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/home-first-impression
          fetch-depth: 0
      - name: Merge main, preserve current templates and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X theirs origin/main || {
            git diff --name-only --diff-filter=U | while IFS= read -r file; do
              git checkout --theirs -- "$file" || git rm -f -- "$file"
              git add -A -- "$file"
            done
          }
          git restore --source=origin/main --staged --worktree -- CLAUDE.md home.css src/index.njk src/making-project.njk src/_data/projects.json src/_data/makingLog.json index.html making-site.html making.html
          rm .github/workflows/pr65-sync.yml
          git add -A
          git commit -m "Sync PR65 with current homepage and preserve later changes"
          git push origin HEAD:claude/home-first-impression
