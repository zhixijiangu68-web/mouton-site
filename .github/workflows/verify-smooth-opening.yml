name: Verify smooth homepage opening
on:
  push:
    branches: [refine/smooth-opening-crossfade-20261013]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refine/smooth-opening-crossfade-20261013
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Build and site regressions
        run: |
          node --check home.js
          node --check home-tabs.js
          npm ci
          npm run build
          npm test
      - name: Inspect real opening frames and transitions
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { resolve } from 'node:path';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          const url='file://'+resolve('index.html');
          for(const width of [390,1280]){
            const page=await b.newPage({viewport:{width,height:844},reducedMotion:'no-preference'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const start=Date.now();
            await page.goto(url,{waitUntil:'load'});
            const measure=()=>page.evaluate(()=>{
              const veil=document.querySelector('.intro-veil');
              const cs=getComputedStyle(veil);
              const hero=getComputedStyle(document.querySelector('.cover-inner'));
              return {veilOpacity:Number(cs.opacity),veilDisplay:cs.display,veilAnimation:cs.animationName,
                veilDuration:cs.animationDuration,veilDelay:cs.animationDelay,
                heroOpacity:Number(hero.opacity),heroAnimation:hero.animationName,
                tabs:[...document.querySelectorAll('[role=tab]')].length,
                activePanel:[...document.querySelectorAll('[data-home-panel]')].filter(x=>!x.hidden).map(x=>x.dataset.homePanel),
                noCursor:document.querySelectorAll('.cursor-dot').length===0,
                overWidth:document.documentElement.scrollWidth>innerWidth+1};
            });
            const a=await measure();
            console.log('START',width,JSON.stringify(a));
            if(a.veilAnimation!=='veil-dissolve'||a.veilDuration!=='1.6s'||a.veilDelay!=='4.5s'||a.veilDisplay!=='grid'||a.heroAnimation!=='home-arrive'||a.tabs!==4||a.activePanel.join()!=='reading'||!a.noCursor||a.overWidth)throw Error('Invalid starting frame');
            const waitUntil=async t=>page.waitForTimeout(Math.max(0,t-(Date.now()-start)));
            await waitUntil(2950);
            const hold=await measure();
            console.log('HOLD',width,JSON.stringify(hold));
            if(hold.veilOpacity<.99||hold.veilDisplay!=='grid')throw Error('Logo no longer holds visibly');
            await waitUntil(5250);
            const midway=await measure();
            console.log('FADE',width,JSON.stringify(midway));
            if(midway.veilOpacity<=.03||midway.veilOpacity>=.97||midway.heroOpacity<=.03||midway.heroOpacity>=1.01)throw Error('Smooth intermediate fade missing');
            await waitUntil(6650);
            const finish=await measure();
            console.log('FINISH',width,JSON.stringify(finish));
            if(finish.veilDisplay!=='none'||finish.heroOpacity<.99)throw Error('Fade did not finish');
            await page.reload({waitUntil:'load'});
            if((await measure()).veilDisplay!=='grid')throw Error('Intro fails on reload');
            await page.locator('.intro-veil').click();
            if((await measure()).veilDisplay!=='none')throw Error('Skip click failed');
            await page.locator('#home-tab-quiz').click();
            if(await page.locator('#home-tab-quiz').getAttribute('aria-selected')!=='true')throw Error('Quiz tab failed');
            await page.goto(url+'#journal',{waitUntil:'load'});
            await page.reload({waitUntil:'load'});
            const direct=await page.evaluate(()=>({intro:document.documentElement.classList.contains('intro'),tab:document.querySelector('#home-tab-journal')?.getAttribute('aria-selected')}));
            if(direct.intro||direct.tab!=='true')throw Error('Direct article link obstructed');
            if(errors.length)throw Error('Page errors '+errors.join(' | '));
            await page.close();
          }
          const reduced=await b.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
          await reduced.goto(url,{waitUntil:'load'});
          const data=await reduced.evaluate(()=>({intro:document.documentElement.classList.contains('intro'),tabs:document.querySelectorAll('[role=tab]').length}));
          console.log('REDUCED',JSON.stringify(data));
          if(data.intro||data.tabs!==4)throw Error('Reduced motion broken');
          await reduced.close();
          await b.close();
          JS
      - name: Remove one-time verifier
        run: |
          rm -f .github/workflows/verify-smooth-opening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize smooth opening after responsive browser verification"
            git push origin HEAD:refine/smooth-opening-crossfade-20261013
          fi
          test -z "$(git status --porcelain)"
