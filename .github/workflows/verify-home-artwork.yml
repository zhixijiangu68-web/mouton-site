name: Verify MOUTON generated artwork
on:
  push:
    branches: [feature/replace-home-cards-with-generated-art-20261013]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/replace-home-cards-with-generated-art-20261013
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check all files and build
        run: |
          npm ci
          npm run build
          npm test
          node --check home.js
          node --check home-tabs.js

      - name: Browser-test artwork, mobile layout, interactions and intro
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { resolve } from 'node:path';
          import { statSync } from 'node:fs';
          const assets=['philosophy-card.webp','body-card.webp','food-science-card.webp'];
          for(const name of assets){
            const bytes=statSync('images/home/'+name).size;
            console.log('IMAGE',name,bytes,'bytes');
            if(bytes<1000||bytes>80000)throw Error('Unexpected artwork size '+name);
          }
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const url='file://'+resolve('index.html');
          for(const [w,h] of [[390,650],[390,844],[768,700],[1280,800],[1600,900]]){
            const page=await browser.newPage({viewport:{width:w,height:h},reducedMotion:'reduce'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(url,{waitUntil:'load'});
            const data=await page.evaluate(async()=>{
              const cards=[...document.querySelectorAll('.cover-choice-card')];
              const backgroundUrls=cards.map(card=>{
                const bg=getComputedStyle(card.querySelector('.cover-choice-art')).backgroundImage;
                const match=bg.match(/url\(["']?([^"')]+)["']?\)/);
                return match?match[1]:null;
              });
              const loaded=await Promise.all(backgroundUrls.map(async src=>new Promise(resolve=>{
                if(!src)return resolve(null);
                const img=new Image();
                img.onload=()=>resolve({width:img.naturalWidth,height:img.naturalHeight});
                img.onerror=()=>resolve(null);
                img.src=src;
              })));
              return {
                cards:cards.map(card=>({href:card.getAttribute('href'),title:card.querySelector('strong')?.textContent,rect:card.getBoundingClientRect().toJSON()})),
                backgrounds:backgroundUrls,
                dimensions:loaded,
                tabs:document.querySelectorAll('[role=tab]').length,
                introWord:document.querySelector('.intro-word')?.textContent.trim(),
                heading:document.querySelector('h1')?.textContent.trim(),
                headingsCharacters:document.querySelectorAll('.cover-title--choice .char').length,
                scrollWidth:document.documentElement.scrollWidth,
                windowWidth:innerWidth
              };
            });
            console.log('VIEWPORT',w,h,JSON.stringify(data));
            if(errors.length||data.cards.length!==3||data.tabs!==4||data.introWord!=='MOUTON'||data.heading!=='今日は、何が気になる？'||data.headingsCharacters!==0||data.scrollWidth>w+1)throw Error('Existing site regression at '+w);
            if(data.dimensions.some(x=>!x||x.width!==400||x.height<360))throw Error('Artwork not loaded at '+w);
            if(data.backgrounds.some((x,i)=>!x.includes(assets[i])))throw Error('Artwork CSS reference mismatch at '+w);
            if(data.cards.some(x=>x.rect.right>w+1||x.rect.x<0))throw Error('Card off screen at '+w);
            await page.screenshot({path:'/tmp/mouton-home-artwork-'+w+'x'+h+'.png'});
            await page.locator('.cover-choice-card--food').click();
            if(!page.url().endsWith('/topic-food.html'))throw Error('Card click fails');
            await page.goto(url,{waitUntil:'load'});
            await page.locator('#home-tab-quiz').click();
            if(await page.locator('#home-tab-quiz').getAttribute('aria-selected')!=='true')throw Error('Tabs broken');
            await page.locator('[data-cover-toggle]').click();
            if(await page.evaluate(()=>document.documentElement.dataset.cover)!=='day')throw Error('Night/Day switch broken');
            await page.close();
          }
          const page=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'no-preference'});
          await page.goto(url,{waitUntil:'load'});
          const intro=await page.evaluate(()=>({enabled:document.documentElement.classList.contains('intro'),effect:getComputedStyle(document.querySelector('.intro-veil')).animationName}));
          console.log('INTRO',JSON.stringify(intro));
          if(!intro.enabled||intro.effect!=='veil-dissolve')throw Error('Original smooth opening not preserved');
          await page.locator('.intro-veil').click();
          if(await page.locator('.intro-veil').evaluate(x=>getComputedStyle(x).display)!=='none')throw Error('Intro skip broken');
          await page.close();
          await browser.close();
          JS
      - name: Remove temporary workflow and commit generated outputs
        run: |
          rm -f .github/workflows/verify-home-artwork.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize generated MOUTON card artwork and synced site build"
            git push origin HEAD:feature/replace-home-cards-with-generated-art-20261013
          fi
          test -z "$(git status --porcelain)"
