name: Verify static three-theme heading
on:
  push:
    branches: [fix/static-home-choice-heading-20261013]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/static-home-choice-heading-20261013
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Build and static checks
        run: |
          npm ci
          npm run build
          npm test
          node --check home.js
          node --check home-tabs.js
      - name: Verify still heading, cards and cinematic intro on browsers
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {resolve} from 'node:path';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const url='file://'+resolve('index.html');
          for(const width of [390,768,1280]){
            const page=await browser.newPage({viewport:{width,height:844},reducedMotion:'no-preference'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(url,{waitUntil:'load'});
            const state=await page.evaluate(()=>{
              const title=document.querySelector('.cover-title--choice');
              const r=title.getBoundingClientRect();
              return {
                title:title.textContent,characters:title.querySelectorAll('.char').length,
                animation:getComputedStyle(title).animationName,
                transform:getComputedStyle(title).transform,
                translate:getComputedStyle(title).translate,
                parentAnimation:getComputedStyle(document.querySelector('.cover-inner')).animationName,
                parentTranslate:getComputedStyle(document.querySelector('.cover-inner')).translate,
                rect:{x:r.x,y:r.y},
                veil:getComputedStyle(document.querySelector('.intro-veil')).animationName,
                cards:document.querySelectorAll('.cover-choice-card').length,
                tabs:document.querySelectorAll('[role=tab]').length,
                scrollWidth:document.documentElement.scrollWidth,
                viewport:innerWidth
              };
            });
            console.log('HEADING',width,JSON.stringify(state));
            if(state.title!=='今日は、何が気になる？'||state.characters!==0||state.animation!=='none'||state.transform!=='none'||state.translate!=='none'||state.parentAnimation!=='choice-hero-fade'||state.parentTranslate!=='none'||state.veil!=='veil-dissolve'||state.cards!==3||state.tabs!==4||state.scrollWidth>width+1)throw Error('Static heading regression at '+width);
            await page.waitForTimeout(600);
            const y=await page.locator('.cover-title--choice').evaluate(el=>el.getBoundingClientRect().y);
            if(Math.abs(y-state.rect.y)>1)throw Error('Heading shifted during introduction '+width);
            await page.locator('.intro-veil').click();
            await page.locator('.cover-choice-card--body').click();
            if(!page.url().endsWith('/topic-body.html'))throw Error('Card not clickable after intro '+width);
            await page.goto(url+'#journal',{waitUntil:'load'});
            await page.reload({waitUntil:'load'});
            const deep=await page.evaluate(()=>({
              intro:document.documentElement.classList.contains('intro'),
              selected:document.querySelector('#home-tab-journal')?.getAttribute('aria-selected')
            }));
            if(deep.intro||deep.selected!=='true')throw Error('Deep link affected '+width);
            if(errors.length)throw Error('JS errors '+errors.join(';'));
            await page.close();
          }
          const page=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
          await page.goto(url,{waitUntil:'load'});
          const accessibility=await page.evaluate(()=>({
            intro:document.documentElement.classList.contains('intro'),
            text:document.querySelector('.cover-title--choice')?.textContent,
            cards:document.querySelectorAll('.cover-choice-card').length
          }));
          console.log('REDUCED',JSON.stringify(accessibility));
          if(accessibility.intro||accessibility.cards!==3||accessibility.text!=='今日は、何が気になる？')throw Error('Reduced motion regression');
          await browser.close();
          JS
      - name: Remove temporary workflow and sync generated site
        run: |
          rm .github/workflows/verify-static-heading.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate static three-theme homepage heading"
            git push origin HEAD:fix/static-home-choice-heading-20261013
          fi
          test -z "$(git status --porcelain)"
