name: PR92 build and responsive verification
on:
  push:
    branches:
      - article-xmax-vs-rebel250-qa-20261013
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: article-xmax-vs-rebel250-qa-20261013
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build from source
        run: |
          npm ci
          npm run build
      - name: Test links and page structure
        run: npm test
      - name: Check mobile and desktop layout
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          for (const width of [390, 1280]) {
            const page = await browser.newPage({viewport:{width,height:844}});
            await page.goto('file://' + process.cwd() + '/xmax-vs-rebel250-qa.html',{waitUntil:'load'});
            const info = await page.evaluate(() => ({
              title:document.title,
              h1:document.querySelectorAll('h1').length,
              questions:document.querySelectorAll('section.qa-block').length,
              scrollWidth:document.documentElement.scrollWidth,
              viewport:window.innerWidth
            }));
            console.log('layout',width,JSON.stringify(info));
            const offenders=await page.evaluate(()=>[...document.querySelectorAll('*')].map(el=>({tag:el.tagName,cls:el.className?.baseVal??el.className,rect:el.getBoundingClientRect(),scroll:el.scrollWidth})).filter(x=>x.rect.right>window.innerWidth+1||x.rect.left < -1).sort((a,b)=>b.rect.right-a.rect.right).slice(0,20).map(x=>({tag:x.tag,cls:String(x.cls).slice(0,90),right:x.rect.right,left:x.rect.left,width:x.rect.width,scroll:x.scroll})));
            console.log('overflow elements:',JSON.stringify(offenders));
            if(info.h1 !== 1 || info.questions !== 17 || info.scrollWidth > info.viewport+1) {
              throw new Error('Layout check failed at '+width+'px');
            }
            await page.screenshot({path:'/tmp/mouton-xmax-'+width+'.png',fullPage:true});
            await page.close();
          }
          await browser.close();
          JS
      - name: Commit clean generated files and remove helper workflow
        run: |
          rm -f .github/workflows/pr92-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild XMAX vs Rebel 250 article with Eleventy and pass checks"
            git push origin HEAD:article-xmax-vs-rebel250-qa-20261013
          fi
          test -z "$(git status --porcelain)"
