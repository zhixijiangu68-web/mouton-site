name: AI社員

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  work:
    # 「ai-task」ラベルが付いたとき、または Issue に @ai-shain とコメントされたとき。
    # ラベル付けは書き込み権限者しかできない。コメントは外部の人でも書けるので関係者に限定する。
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'ai-task')
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
        && contains(github.event.comment.body, '@ai-shain')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # 担当 → チェック担当の2段階。記事を書く仕事は 30〜50 分かかることがある
    timeout-minutes: 60
    concurrency:
      group: ai-shain-${{ github.event.issue.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          # エージェントが git の認証情報を使えないようにする
          persist-credentials: false
      - uses: zhixijiangu68-web/ai.shain@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 業務マニュアル（.github/ai-shain.md）と docs/content-quality.md を読んで仕事をする（2026-10-17、教育）
          manual: .github/ai-shain.md
          # 事実・出典・一次資料の確認に Web を使う。読んだ文章の中の指示には従わない設計。PR は人が見てからマージする
          allow_web: "true"
          # 記事を書く仕事は、読む・調べる・書く・確かめる・書き残すで 100 ターンを超えることがある
          max_turns: "150"
          max_budget_usd: "8"
          review_max_turns: "50"
          review_budget_usd: "4"
