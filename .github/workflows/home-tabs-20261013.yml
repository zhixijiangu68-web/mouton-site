name: Verify MOUTON homepage tabs
on:
  push:
    branches: [feature/mouton-home-tabs-20261013]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mouton-home-tabs-20261013
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Build and verify site
        run: |
          node --check home-tabs.js
          npm ci
          npm run build
          npm test
      - name: Test tabs, keyboard, anchor links and responsive height
        run: |
          git show origin/main:index.html > baseline-pr-tabs.html
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {resolve} from 'node:path';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const go=filename=>'file://'+resolve(filename);
          for(const width of [390,768,1280]){
            const page=await browser.newPage({viewport:{width,height:844},reducedMotion:'reduce'});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto(go('baseline-pr-tabs.html'),{waitUntil:'load'});
            const oldHeight=await page.evaluate(()=>document.documentElement.scrollHeight);
            await page.goto(go('index.html'),{waitUntil:'load'});
            const initial=await page.evaluate(()=>({
              width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
              height:document.documentElement.scrollHeight,
              tabs:document.querySelectorAll('[role=tab]').length,
              panels:document.querySelectorAll('[role=tabpanel]').length,
              visible:[...document.querySelectorAll('[data-home-panel]')].filter(p=>!p.hidden).map(p=>p.dataset.homePanel),
              h1:document.querySelectorAll('h1').length
            }));
            console.log('INITIAL',width,JSON.stringify({oldHeight,...initial,ratio:Number((initial.height/oldHeight).toFixed(3))}));
            if(initial.scrollWidth>width+1||initial.tabs!==4||initial.panels!==4||initial.h1!==1||initial.visible.join()!=='reading'||initial.height>=oldHeight*.65)throw Error('Initial failure '+width);
            const choose=async (tab,expected)=>{await page.locator('#home-tab-'+tab).click();const selection=await page.evaluate(()=>[...document.querySelectorAll('[data-home-panel]')].filter(x=>!x.hidden).map(x=>x.dataset.homePanel));if(selection.join()!==expected)throw Error('Selection '+tab+' '+selection);};
            await choose('quiz','quiz');
            if(await page.locator('#today-q [data-qloop]').count()!==1)throw Error('Quiz content missing');
            await choose('topics','topics');
            if(await page.locator('.home-topic-card:visible').count()!==3||await page.locator('#guides .guide-card:visible').count()!==3||await page.locator('.home-more-grid a:visible').count()!==3)throw Error('Theme/guide/book links missing');
            await choose('journal','journal');
            await page.locator('[data-journal-filter=body]').click();
            if(await page.locator('#journal .journal-item:not(.is-hidden):visible').count()<1)throw Error('Journal filtering failed');
            await page.locator('[data-journal-filter=all]').click();
            await page.locator('#journal-search-input').fill('睡眠');
            if((await page.locator('#journal .journal-item:not(.is-hidden):visible').count())===0)throw Error('Journal search failed');
            await page.locator('#journal-search-input').fill('');
            await page.locator('#home-tab-journal').focus();
            await page.keyboard.press('ArrowRight');
            if(await page.locator('#home-tab-reading').getAttribute('aria-selected')!=='true')throw Error('Keyboard cycling failed');
            await page.locator('[data-cover-toggle]').click();
            if(await page.evaluate(()=>document.documentElement.dataset.cover)!=='day')throw Error('Cover toggle failed');
            // Existing deep links must open their owning tab after refresh.
            await page.goto(go('index.html')+'#guides',{waitUntil:'load'});
            if(await page.locator('#home-tab-topics').getAttribute('aria-selected')!=='true')throw Error('Guides deep link failed');
            await page.goto(go('index.html')+'#journal',{waitUntil:'load'});
            if(await page.locator('#home-tab-journal').getAttribute('aria-selected')!=='true')throw Error('Journal deep link failed');
            await page.goto(go('index.html')+'#projects',{waitUntil:'load'});
            if(await page.locator('#home-tab-topics').getAttribute('aria-selected')!=='true')throw Error('Projects deep link failed');
            if(width===390){
              await page.locator('.menu-toggle').click();
              if(await page.locator('.menu-toggle').getAttribute('aria-expanded')!=='true')throw Error('Menu failed');
            }
            if(errors.length)throw Error('JS errors '+width+' '+errors.join(' | '));
            await page.close();
          }
          const nojs=await browser.newPage({viewport:{width:390,height:844},javaScriptEnabled:false});
          await nojs.goto(go('index.html'),{waitUntil:'load'});
          const visible=await nojs.locator('.home-tab-panel:visible').count();
          console.log('NOJS',visible);
          if(visible!==4)throw Error('No JS content inaccessible');
          await nojs.close();
          const club=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
          await club.goto(go('index.html')+'?version=club',{waitUntil:'load'});
          const mode=await club.evaluate(()=>({selected:document.documentElement.dataset.version,buttons:document.querySelectorAll('[role=tab]').length}));
          console.log('CLUB',JSON.stringify(mode));
          if(mode.selected!=='club'||mode.buttons!==4)throw Error('CLUB mode changed');
          await club.close();
          await browser.close();
          JS
      - name: Commit generated pages; remove temporary test workflow
        run: |
          rm -f baseline-pr-tabs.html .github/workflows/home-tabs-20261013.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Generate and verify four-tab MOUTON homepage"
            git push origin HEAD:feature/mouton-home-tabs-20261013
          fi
          test -z "$(git status --porcelain)"
