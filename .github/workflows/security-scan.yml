name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocks: dependencies that run in visitors' browsers or on a server. This site ships only
      # generated HTML, so today there are none, and this must stay at zero.
      - name: Runtime dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      # Reports only: the build tools (Eleventy and what it pulls in). Their known issues need
      # crafted input to the build itself and have no fixed release yet, so they must not stop
      # every PR. Read the log; never "fix" with --force (it downgrades Eleventy to 0.6).
      - name: Build-tool dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
