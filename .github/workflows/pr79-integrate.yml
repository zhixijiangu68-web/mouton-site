name: Integrate PR79 design editions with current site
on:
  push:
    branches: [integrate-pr79-design-version-20261013]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integrate-pr79-design-version-20261013
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Recover edition sources from PR79 and update current templates
        run: |
          git fetch origin codex/design-version-club:refs/remotes/origin/codex/design-version-club
          git restore --source=origin/codex/design-version-club -- design-version.css design-version.js src/_includes/partials/design-version.njk tests/design-version.test.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          def change(path,old,new):
            p=Path(path)
            s=p.read_text()
            assert old in s,(path,old)
            p.write_text(s.replace(old,new,1))
          change('src/_includes/base.njk','<html lang="{{ lang or \'ja\' }}" data-root="{{ root }}">','<html lang="{{ lang or \'ja\' }}" data-root="{{ root }}" data-version="original">')
          change('src/_includes/base.njk','<meta name="theme-color" content="#f8f5ee">','<meta name="theme-color" content="#f8f5ee">\n<script src="{{ root }}design-version.js"></script>')
          change('src/_includes/base.njk','<script src="{{ root }}site.js" defer></script>','<link rel="stylesheet" href="{{ root }}design-version.css">\n<script src="{{ root }}site.js" defer></script>')
          for path in ('src/_includes/partials/nav.njk','src/_includes/partials/nav-en.njk'):
            s=Path(path).read_text()
            find='  <button class="menu-toggle"'
            assert find in s
            Path(path).write_text(s.replace(find,'  {% include "partials/design-version.njk" %}\n'+find,1))
          change('site.css','@media(max-width:860px){','@media(max-width:1180px){')
          change('site.js',"window.matchMedia('(max-width: 860px)')","window.matchMedia('(max-width: 1180px)')")
          change('site.js',"window.addEventListener('resize',remeasure);","window.addEventListener('resize',remeasure);\n document.addEventListener('mouton:versionchange',remeasure);")
          change('src/index.njk','    <div class="cover-inner">','    <div class="cover-inner">\n      <div class="club-signature" aria-hidden="true"><span>MOUTON / VOL.02</span><span>AFTER HOURS, OPEN MINDS.</span></div>')
          p=Path('package.json')
          package=json.loads(p.read_text())
          package['scripts']['test:design']='node --test tests/design-version.test.mjs'
          package['scripts']['test']='npm run test:design && eleventy && node scripts/check-site.mjs'
          p.write_text(json.dumps(package,ensure_ascii=False,indent=2)+'\n')
          PY
          cat >> design-version.css <<'CSS'

          /* PR79 adapted to the October 13 Night/Day cover, reading cards, and first-visit animation. */
          html[data-version="club"] body.site:not(.article-page):not(.doc-page){
            --night:#0b0912;--night-2:#171020;--on-night:#f5ecfb;--on-night-2:#cfbfde;--glow:#9f77dd
          }
          html[data-version="club"] .cover{
            background:radial-gradient(ellipse 55% 65% at 80% 20%,rgba(122,50,177,.68),transparent 80%),
              radial-gradient(ellipse 45% 55% at 14% 90%,rgba(120,42,78,.65),transparent 80%),#0b0912
          }
          html[data-version="club"] .cover .cover-art{filter:hue-rotate(65deg) saturate(.95)}
          html[data-version="club"] .cover .cover-title{font-family:var(--gothic);font-weight:700;letter-spacing:-.04em;line-height:1.25}
          html[data-version="club"] .cover .cover-title .nowrap:last-child{color:#d6fa90}
          html[data-version="club"] .cover .cover-kicker{font:500 .75rem/1.4 var(--gothic);letter-spacing:.2em;color:#d6fa90}
          html[data-version="club"] .cover .cover-lede{color:#e0cfe9}
          html[data-version="club"] .cover .cover-btn.is-primary{background:#d6fa90;border-color:#d6fa90;color:#0b0912}
          html[data-version="club"] .cover .cover-btn:not(.is-primary){border-color:#a68cce}
          html[data-version="club"] .cover .cover-links a{color:#e2d4ea}
          html[data-version="club"] .cover .hero-word{-webkit-text-stroke:1px rgba(214,250,144,.45)}
          html[data-version="club"] .hero-ticker{background:rgba(22,9,38,.76)}
          html[data-version="club"] .hero-ticker-label{background:#d6fa90;color:#0c0916}
          html[data-version="club"] .hero-ticker-label::after{background:#d6fa90}
          html[data-version="club"] .hero-ticker-list a:hover{color:#d6fa90}
          html[data-version="club"] .cover .club-signature{display:flex;justify-content:space-between;gap:12px;color:#d6fa90;padding:0 0 12px;margin:0 0 22px;border-bottom:1px solid rgba(214,250,144,.32);font:500 .625rem/1.6 var(--gothic);letter-spacing:.16em}
          html[data-version="club"] .cover-section{background:#0e0a17;color:#f5ecfb}
          html[data-version="club"] .cover-section+.cover-section{background:#161023}
          html[data-version="club"] .cover-section-title{font-family:var(--gothic);font-weight:600;color:#f5ecfb}
          html[data-version="club"] .reading3-card{background:rgba(205,170,245,.07);border-color:rgba(205,170,245,.3)}
          html[data-version="club"] .reading3-card.is-feature{background:linear-gradient(150deg,rgba(128,76,198,.38),rgba(205,170,245,.04) 72%)}
          html[data-version="club"] .reading3-go{color:#d6fa90}
          html[data-version="club"] .today-kicker{color:#d6fa90}
          html[data-version="club"] .today-qloop{--qa:#c4acff;--qr:#8ce0b5;--qw:#ff9b9b}
          html[data-version="club"] .cover-mode{background:rgba(14,9,22,.8)}
          html[data-version="club"] .cover-mode-day{color:#ded0ea}
          @media(max-width:760px){
            html[data-version="club"] .cover .club-signature{font-size:.55rem}
            html[data-version="club"] .cover .club-signature span:last-child{display:none}
          }
          @media(prefers-reduced-motion:reduce){
            html[data-version="club"] .cover .hero-word{animation:none}
          }
          CSS
      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test
          node --check design-version.js
      - name: Browser smoke test on mobile and desktop
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { resolve } from 'node:path';
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          const candidates=['index.html','guides.html','en/index.html','aspirin.html'];
          for(const width of [390,1280]){
            const page=await browser.newPage({viewport:{width,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            for (const path of candidates){
              await page.goto('file://'+resolve(path)+'?version=original',{waitUntil:'load'});
              const select=page.locator('[data-version-picker]');
              if(await select.count()!==1)throw Error('Missing version picker '+path);
              let state=await page.evaluate(()=>({version:document.documentElement.dataset.version,scroll:document.documentElement.scrollWidth,width:innerWidth,h1:document.querySelectorAll('h1').length}));
              if(state.version!=='original'||state.scroll>state.width+1||state.h1!==1)throw Error('Original layout '+width+' '+path+JSON.stringify(state));
              await select.selectOption('club');
              state=await page.evaluate(()=>({version:document.documentElement.dataset.version,scroll:document.documentElement.scrollWidth,width:innerWidth,picker:document.querySelector('[data-version-picker]').value}));
              if(state.version!=='club'||state.scroll>state.width+1||state.picker!=='club')throw Error('Club layout '+width+' '+path+JSON.stringify(state));
              if(path==='index.html'){
                const features=await page.evaluate(()=>({ticker:document.querySelectorAll('.hero-ticker-list a').length,cards:document.querySelectorAll('.reading3-card').length,nightDay:!!document.querySelector('[data-cover-toggle]'),quiz:!!document.querySelector('[data-qloop]'),clubColor:getComputedStyle(document.querySelector('.cover')).backgroundColor}));
                console.log('Home features',width,JSON.stringify(features));
                if(features.ticker<12||features.cards!==3||!features.nightDay||!features.quiz)throw Error('Current homepage features regressed');
              }
              console.log('PASS',width,path,JSON.stringify(state));
            }
            if(errors.length)throw Error('Uncaught JS errors '+errors.join('; '));
            await page.close();
          }
          const reduced=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
          await reduced.goto('file://'+resolve('index.html')+'?version=club',{waitUntil:'load'});
          const ok=await reduced.evaluate(()=>!document.documentElement.classList.contains('intro')&&getComputedStyle(document.querySelector('.hero-ticker-list')).animationName==='none');
          if(!ok)throw Error('Reduced motion not respected');
          await browser.close();
          JS
      - name: Commit fresh generated outputs and remove helper
        run: |
          rm -f .github/workflows/pr79-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate PR79 ORIGINAL/CLUB edition, rebuild and test current site"
          git push origin HEAD:integrate-pr79-design-version-20261013
